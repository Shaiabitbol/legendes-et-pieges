<title>Légendes et Pièges</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Chakra+Petch:wght@400;600;700&family=Rubik:wght@400;600;800&display=swap">
<style>
/* Layout : une console de jeu — bandeau de stats en haut, scène au centre, barre d'onglets fixe en bas. */
:root{
  --night:#0e1024; --deep:#171a3a; --panel:#1f2350; --line:#353b7a; --ink:#eef0ff; --mute:#a3a8d6;
  --ember:#ff8a3d; --gold:#ffd166; --arc:#5ee6ff; --ok:#5dd39e; --bad:#ff5d73;
  --display:'Russo One','Arial Black',Impact,sans-serif; --body:'Chakra Petch','Trebuchet MS',Verdana,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%}
body{background:radial-gradient(120% 80% at 50% 0%,#232863 0%,var(--night) 60%) fixed,var(--night);color:var(--ink);font:16px/1.45 var(--body)}
#app{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:10px 96px;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.logo{font:22px/1 var(--display);letter-spacing:.5px;text-shadow:0 0 18px rgba(94,230,255,.45)}
.logo b{color:var(--ember);font-weight:400}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--deep);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
#updbar{background:#3d2f10;border:1px solid var(--gold);border-radius:10px;padding:8px 12px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
#invbar{background:#123a4d;border:1px solid var(--arc);border-radius:10px;padding:8px 12px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:center}.duo>div{display:flex;flex-direction:column;gap:4px;min-width:0}.flip{transform:scaleX(-1)}
.mvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.mvs button{display:flex;flex-direction:column;gap:2px;align-items:center}.mvs small{font-weight:400;color:var(--mute);font-size:12px}
:root[lang=he]{--display:'Rubik','Arial Hebrew',Arial,sans-serif;--body:'Rubik','Arial Hebrew',Arial,sans-serif}
:root[lang=he] h1,:root[lang=he] h2,:root[lang=he] h3,:root[lang=he] .q,:root[lang=he] .card .nm{font-weight:800}
[dir=rtl] .pad,[dir=rtl] .fhud,[dir=rtl] .duo,[dir=rtl] .recipe,[dir=rtl] .scene,[dir=rtl] .logo{direction:ltr}
[dir=rtl] .opts button{text-align:right}
#hout{min-height:0;padding:4px 12px;cursor:pointer;color:var(--bad);display:inline-flex;align-items:center;gap:6px}#hout svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#hcfg{min-height:0;cursor:pointer;font-size:15px;line-height:1}
.cfgm button{width:100%}
#hrel{min-height:0;cursor:pointer;font-size:16px;line-height:1}
#hlang{min-height:0;padding:4px 12px;cursor:pointer;color:var(--arc)}
.fhud{grid-template-columns:1fr auto 1fr!important;align-items:start}
#fwrap{display:flex;flex-direction:column;gap:12px}
#fwrap.fs{position:fixed;inset:0;z-index:30;background:#05060f;display:block}
.fs #arena{position:absolute;inset:0;width:100%;height:100%;max-height:none;border:0;border-radius:0;aspect-ratio:auto}
.fs .fhud{position:absolute;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 14px;z-index:2;background:linear-gradient(rgba(5,6,15,.85),rgba(5,6,15,0))}
.fs .pad{position:absolute;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:0 16px;z-index:2;pointer-events:none}
.fs .pad>*{pointer-events:auto;opacity:.82}
.fs #fres{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:3;pointer-events:none}
.fs #fres>*{pointer-events:auto;max-width:420px}
#bsp.rdy{box-shadow:0 0 20px #c77dff;animation:pulse .6s infinite alternate}
@keyframes pulse{to{filter:brightness(1.8)}}
.code{font:700 17px ui-monospace,Menlo,Consolas,monospace;letter-spacing:2px;color:var(--gold);user-select:all;-webkit-user-select:all}
.chip.pts{color:var(--gold);border-color:#7a6230}
#evbar{background:linear-gradient(90deg,#5b1d4f,#8a2d2d,#5b1d4f);background-size:200% 100%;animation:slide 6s linear infinite;border:1px solid var(--ember);border-radius:10px;padding:8px 12px;font-weight:700;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
@keyframes slide{to{background-position:200% 0}}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.4px}
h2{font-size:20px}h3{font-size:16px}
p{margin:0}
.mute{color:var(--mute)}.small{font-size:13px}
.panel{background:linear-gradient(180deg,rgba(31,35,80,.95),rgba(23,26,58,.95));border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid.coll{grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.coll .card .nm{font-size:13px}
@media (max-width:420px){.grid:not(.coll){grid-template-columns:repeat(2,minmax(0,1fr))}.stats{gap:6px}.stats .chip{padding:4px 9px}}
.split{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:720px){.split{grid-template-columns:1fr 1fr}}
button{font:700 15px var(--body);color:var(--ink);cursor:pointer;border:1px solid var(--line);background:var(--deep);border-radius:10px;padding:10px 14px;min-height:42px}
button:hover:not(:disabled){border-color:var(--arc)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--arc);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.btn{background:linear-gradient(180deg,#ffa35a,#e2622a);border-color:#ffc08a;color:#22100a;text-shadow:none;box-shadow:0 4px 0 #8b3413}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #8b3413}
.btn2{background:linear-gradient(180deg,#3fd4f2,#1f8fc4);border-color:#a5f0ff;color:#04202c;box-shadow:0 4px 0 #0f5578}
input,select,textarea{font:16px var(--body);color:var(--ink);background:#10122b;border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;max-width:100%}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute);font-weight:600;min-width:0}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(14,16,36,.96);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:4px;z-index:20}
nav button{flex:1;max-width:150px;min-width:0;padding:8px 2px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-color:transparent;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mute)}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--gold);background:var(--deep);border-color:var(--line)}
canvas.pt{width:100%;max-width:160px;aspect-ratio:18/19;display:block;margin:0 auto}
.card{position:relative;background:linear-gradient(180deg,#262b63,#161938);border:2px solid var(--rc,var(--line));border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:4px;text-align:center;cursor:pointer;min-height:0;font-weight:600}
.card.sel{box-shadow:0 0 0 2px var(--gold),0 0 22px rgba(255,209,102,.45)}
.card.lock canvas{filter:brightness(.18) saturate(0)}
.card .nm{font:15px var(--display)}
.rar{color:var(--rc);font-size:12px;text-transform:uppercase;letter-spacing:1.2px;font-weight:700}
.stars{color:var(--gold);letter-spacing:2px}
.bar{height:12px;background:#0b0c1e;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:50%;background:var(--ok);transition:width .12s}
.bar.en i{background:linear-gradient(90deg,#2aa7ff,var(--arc))}.bar.sh{height:6px}.bar.sh i{background:var(--gold)}
.bar.xp i{background:linear-gradient(90deg,#b06cff,#ff7ad9)}
.diff{display:flex;gap:6px;flex-wrap:wrap}
.diff button.on{background:var(--panel);border-color:var(--gold);color:var(--gold)}
.rid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.rid button{aspect-ratio:1;font:20px var(--display);padding:0}
.rid button.done{background:#1d4a3c;border-color:var(--ok);color:var(--ok)}
.rid button.fail{background:#4a1a26;border-color:var(--bad);color:var(--bad)}
.rid button:disabled.done,.rid button:disabled.fail{opacity:1}
.good{outline:3px solid var(--ok)!important;outline-offset:2px;opacity:1!important;border-radius:8px}
.scene.act,.scene.act .it{touch-action:none}.scene.act .it{cursor:grab}.it.sel{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
.rid button.day{border-color:var(--gold);box-shadow:0 0 14px rgba(255,209,102,.5)}
.q{font:20px/1.3 var(--display);text-wrap:balance}
.dfw{display:flex;flex-direction:column;gap:8px}.scene.df{cursor:crosshair}.dfo{position:absolute;width:13%;aspect-ratio:1;border:3px solid #3ff08f;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 10px #3ff08f;pointer-events:none}
.pic{background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-size:clamp(24px,7.5vw,40px);line-height:1.4;overflow-x:auto}
.pic>div{white-space:nowrap}.pic.sm{font-size:clamp(20px,6vw,30px);line-height:1.25}.pic.xs{font-size:clamp(15px,4.6vw,24px);line-height:1.2}
.mvbox{position:relative;height:200px;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:72px;gap:6px}
.mvb{position:absolute;left:15%;top:15%;font-size:34px;line-height:1;transform:translate(-50%,-50%)}.mvh{position:absolute;left:80%;top:78%;width:46px;height:46px;border-radius:50%;background:#000;box-shadow:inset 0 0 10px #555;transform:translate(-50%,-50%)}.mvh.sm{width:30px;height:30px;left:62%;top:35%}
.mvp{width:70%;height:10px;background:#0006;border-radius:6px;overflow:hidden}.mvp i{display:block;height:100%;width:0;background:var(--ok)}
.q .w{font:inherit;padding:0 2px;min-height:0;border:none;background:none;display:inline;color:inherit;cursor:pointer}
.opts{display:grid;gap:8px;grid-template-columns:1fr}
@media(min-width:560px){.opts{grid-template-columns:1fr 1fr}}
.opts.em{grid-template-columns:1fr 1fr}.opts.em button{font-size:32px;justify-content:center;text-align:center;line-height:1.2}
.opts button{text-align:left;font-size:16px}
.scene{position:relative;aspect-ratio:16/10;border-radius:12px;overflow:hidden;border:1px solid var(--line);container-type:inline-size;max-width:100%}
.scene.plage{background:linear-gradient(#58c7ff 0 45%,#1b7fc4 45% 62%,#f0d08a 62%)}
.scene.savane{background:linear-gradient(#ffcf7a 0 55%,#b98a3c 55%)}
.scene.nuit{background:linear-gradient(#0b1030,#2a2060 70%,#1b3a2a 70%)}
.scene.labo{background:repeating-linear-gradient(90deg,#20264f 0 40px,#252c5c 40px 80px)}
.scene.cuisine{background:linear-gradient(#f3e3c3 0 58%,#a8673a 58% 62%,#d9cfbd 62%)}
.scene.ville{background:linear-gradient(#8fd3ff 0 50%,#9aa3b5 50% 70%,#55596a 70%)}
.scene.mer{background:linear-gradient(#2fb6e8,#0f5d9c 75%,#d8c08a 75%)}
.scene.neige{background:linear-gradient(#bfe3ff 0 52%,#f4f9ff 52%)}
.scene.foret{background:linear-gradient(#a8e6a1 0 50%,#3d7a3a 50% 64%,#5a3d22 64%)}
.it{position:absolute;transform:translate(-50%,-50%);font-size:calc(var(--s)*1cqw);line-height:1;background:none;border:none;padding:0;min-height:0;cursor:pointer;box-shadow:none;border-radius:0;outline:none}
.it.t{font-family:var(--display);padding:2cqw 4cqw;border-radius:2cqw;color:#fff;border:2px solid #fff}
.res{border-radius:10px;padding:10px 12px;font-weight:700}
.res.ok{background:#17402f;border:1px solid var(--ok)}.res.ko{background:#4a1a26;border:1px solid var(--bad)}
#arena{width:100%;aspect-ratio:16/9;display:block;border-radius:12px;border:1px solid var(--line);background:#090a18;max-height:62vh;margin:0 auto;touch-action:none}
.fhud{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fhud>div{display:flex;flex-direction:column;gap:3px;min-width:0}
.fhud .r{text-align:right}.fhud .r .bar i{margin-left:auto}
.pad{display:flex;justify-content:space-between;align-items:center;gap:10px;touch-action:none;user-select:none;-webkit-user-select:none}
#joy{width:118px;height:118px;border-radius:50%;background:radial-gradient(#2a2f6a,#14173a);border:2px solid var(--line);position:relative;flex:none;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;background:radial-gradient(#8ff0ff,#2a8fc0);box-shadow:0 0 16px var(--arc)}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,62px));gap:13px;touch-action:none}
.acts button{aspect-ratio:1;border-radius:50%;padding:0;font-size:11px;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;touch-action:none}
.acts button kbd{font:10px var(--body);color:var(--mute)}
.fs .acts{gap:15px}.fs .pad>*{opacity:.7}
.acts .a1{background:#7a2b22;border-color:var(--ember)}.acts .a2{background:#134a66;border-color:var(--arc)}
.acts .a3{background:#5a4712;border-color:var(--gold)}.acts .a4{background:#1d4a3c;border-color:var(--ok)}.acts .a5{background:#4b1e66;border-color:#c77dff}
.acts .a6{background:#5a1f2a;border-color:#ff5d73;gap:0}
.acts .aq{grid-column:1/-1;aspect-ratio:auto;border-radius:12px;min-height:30px}
.acts .aq2{grid-column:span 2;aspect-ratio:auto;border-radius:12px;align-self:center;min-height:30px}
.acts .a7{background:#1b3a5e;border-color:#7fb8ff}
.acts button.dn{filter:brightness(1.6)}
.reg{display:flex;flex-direction:row;align-items:center;gap:12px;border-color:var(--ec);background:linear-gradient(90deg,color-mix(in srgb,var(--ec) 18%,#161938),#161938);cursor:pointer;text-align:left;width:100%}
.reg.lock{filter:grayscale(.85);opacity:.6}
.regi{font-size:34px;width:48px;text-align:center;flex:none}
.advp{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.advp button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-color:var(--line)}
.advp button.cur{border-color:var(--ec);box-shadow:0 0 14px color-mix(in srgb,var(--ec) 55%,transparent)}
.advp button.done{opacity:.7}
.advp button.boss{border-width:2px}
.atabs{display:flex;flex-wrap:wrap;gap:6px}
.atabs button{min-height:0;padding:8px 12px;font-size:14px}
.atabs button.on{border-color:var(--gold);color:var(--gold);background:var(--deep)}
.djb{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;width:100%}
.djb button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;border-color:#c77dff}
/* Thèmes achetés dans le profil */
html[data-th=lave]{--night:#1a0906;--deep:#2a110c;--line:#7a2f1c;--arc:#ffb36b}
html[data-th=lave] body{background:radial-gradient(120% 80% at 50% 0%,#5e1b0d 0%,var(--night) 60%) fixed,var(--night)}
html[data-th=lave] .panel{background:linear-gradient(180deg,rgba(74,26,16,.95),rgba(40,14,9,.95))}
html[data-th=ocean]{--night:#03141f;--deep:#082435;--line:#145a73;--arc:#4fe0ff}
html[data-th=ocean] body{background:radial-gradient(120% 80% at 50% 0%,#0b4a63 0%,var(--night) 60%) fixed,var(--night)}
html[data-th=ocean] .panel{background:linear-gradient(180deg,rgba(10,52,74,.95),rgba(5,30,45,.95))}
html[data-th=foret]{--night:#07140a;--deep:#0e2414;--line:#2b6a37;--arc:#8dff9e}
html[data-th=foret] body{background:radial-gradient(120% 80% at 50% 0%,#174d22 0%,var(--night) 60%) fixed,var(--night)}
html[data-th=foret] .panel{background:linear-gradient(180deg,rgba(20,58,28,.95),rgba(10,32,16,.95))}
html[data-th=or]{--night:#141005;--deep:#241c08;--line:#8a6a1a;--arc:#ffe08a}
html[data-th=or] body{background:radial-gradient(120% 80% at 50% 0%,#5a4410 0%,var(--night) 60%) fixed,var(--night)}
html[data-th=or] .panel{background:linear-gradient(180deg,rgba(66,50,14,.95),rgba(36,28,8,.95));border-color:#8a6a1a}
/* Roue de la fortune */
.seag{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}
.seat{align-items:center;text-align:center;padding:10px 6px;gap:4px}
.seat.ok{border-color:var(--gold);box-shadow:0 0 12px rgba(255,209,102,.35)}
.seat.got{opacity:.55}
.cqg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.cqt.me{border-color:var(--ok);box-shadow:0 0 14px rgba(93,211,158,.35)}
.pl{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.wheel{position:relative;width:230px;height:230px;margin:0 auto}
.wheel svg{width:100%;height:100%;transition:transform 3.2s cubic-bezier(.15,.85,.2,1)}
.wheel:after{content:'';position:absolute;left:50%;top:-6px;transform:translateX(-50%);border:12px solid transparent;border-top:22px solid var(--gold);filter:drop-shadow(0 2px 3px #000)}
.cxl{display:flex;align-items:center;gap:10px;border:1px dashed var(--gold);border-radius:10px;padding:6px 10px;background:rgba(255,209,102,.06)}
.recipe{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:4px;text-align:center;font:20px var(--display)}
.recipe canvas{max-width:92px}
.mach{background:radial-gradient(circle at 50% 30%,#3a2a6e,#151734);border:2px solid #7c5cff;box-shadow:inset 0 0 40px rgba(124,92,255,.35)}
.mach.run canvas{animation:spin 1.2s ease-in-out infinite alternate}
@keyframes spin{to{transform:scale(.86) rotate(6deg);filter:brightness(1.8)}}
#modal{position:fixed;inset:0;background:rgba(6,7,18,.86);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
#modal .panel{max-width:360px;width:100%;text-align:center;align-items:center;border-color:var(--rc,var(--gold));box-shadow:0 0 60px var(--rc,var(--gold));animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000;border:1px solid var(--gold);color:var(--gold);padding:8px 16px;border-radius:999px;font-weight:700;z-index:50;max-width:90vw;text-align:center}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.tw{overflow-x:auto}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Look « jeu vidéo » : couleurs vives, panneaux en relief, boutons bonbon ===== */
:root{--night:#1b0b4a;--deep:#2a1670;--panel:#34208a;--line:#6b54d6;--mute:#c9c0ff;--arc:#4ff0ff;--gold:#ffd23f;--ember:#ff7a2f;--ok:#3ff08f;--bad:#ff4f7b}
body{background:
  radial-gradient(40% 30% at 10% 8%,rgba(255,79,216,.55),transparent 70%),
  radial-gradient(45% 35% at 92% 18%,rgba(79,240,255,.45),transparent 70%),
  radial-gradient(60% 40% at 50% 105%,rgba(255,178,56,.40),transparent 70%),
  linear-gradient(165deg,#3b1aa8 0%,#2a1690 35%,#1d1270 65%,#160d52 100%) fixed;}
body:before{content:'';position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.35;background-image:radial-gradient(#fff 1px,transparent 1.5px),radial-gradient(#fff 1px,transparent 1.5px);background-size:46px 46px,73px 73px;background-position:0 0,23px 31px;animation:twinkle 6s ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:.15}}
.logo{font-size:24px;background:linear-gradient(180deg,#fff 30%,#ffd23f);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 3px 0 rgba(0,0,0,.45))}
.logo b{color:#ff7a2f;-webkit-text-fill-color:#ff7a2f}
#hhal{-webkit-text-fill-color:initial;color:initial}
#hnick{box-shadow:none!important;transform:none!important}
.panel{background:linear-gradient(180deg,rgba(78,50,190,.92),rgba(44,26,128,.94));border:2px solid rgba(190,170,255,.55);border-radius:20px;box-shadow:0 6px 0 rgba(12,4,40,.55),inset 0 1px 0 rgba(255,255,255,.25);padding:16px}
.panel .panel{box-shadow:0 3px 0 rgba(12,4,40,.45),inset 0 1px 0 rgba(255,255,255,.18);background:linear-gradient(180deg,rgba(60,36,160,.9),rgba(38,22,110,.92))}
h2{font-size:22px;text-shadow:0 3px 0 rgba(0,0,0,.35)}h3{text-shadow:0 2px 0 rgba(0,0,0,.3)}
.chip{background:rgba(20,8,60,.55);border:2px solid rgba(190,170,255,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.chip.pts{background:linear-gradient(180deg,#ffe066,#ffb31f);color:#3a2200;border-color:#fff3b0;box-shadow:0 3px 0 #a86a00}
button{border:2px solid rgba(190,170,255,.55);background:linear-gradient(180deg,#5a3fd6,#4029ad);border-radius:14px;box-shadow:0 4px 0 #1f1068,inset 0 1px 0 rgba(255,255,255,.25);transition:transform .08s,box-shadow .08s,filter .15s}
button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #1f1068}
button:hover:not(:disabled){filter:brightness(1.12)}
.btn{background:linear-gradient(180deg,#ffb347,#ff6a1f);border-color:#ffd9a8;color:#2b0f00;box-shadow:0 5px 0 #9a3a06,inset 0 2px 0 rgba(255,255,255,.45);font-family:var(--display);font-weight:400;letter-spacing:.3px}
.btn:active:not(:disabled){box-shadow:0 2px 0 #9a3a06}
.btn2{background:linear-gradient(180deg,#5ff3ff,#14b4e0);border-color:#c8fbff;color:#032532;box-shadow:0 5px 0 #0a6688,inset 0 2px 0 rgba(255,255,255,.5)}
.btn2:active:not(:disabled){box-shadow:0 2px 0 #0a6688}
input,select,textarea{background:rgba(15,6,50,.75);border:2px solid rgba(190,170,255,.45);border-radius:12px}
nav{background:linear-gradient(180deg,rgba(40,20,120,.97),rgba(22,10,72,.98));border-top:2px solid rgba(190,170,255,.45);box-shadow:0 -6px 20px rgba(0,0,0,.35)}
nav button{background:none;border-color:transparent;box-shadow:none;color:#c9c0ff}
nav button svg{width:24px;height:24px;stroke-width:2.4}
nav button.on{color:#2b0f00;background:linear-gradient(180deg,#ffe066,#ffb31f);border-color:#fff3b0;box-shadow:0 3px 0 #a86a00;transform:translateY(-3px)}
.card{background:linear-gradient(180deg,#5a3bd0,#2e1a86);border-width:3px;border-radius:16px;box-shadow:0 4px 0 rgba(12,4,40,.5)}
.bar{background:rgba(10,4,35,.75);border:2px solid rgba(190,170,255,.4);border-radius:8px}
.res.ok{background:linear-gradient(180deg,#1f7a52,#145a3b);border:2px solid var(--ok)}.res.ko{background:linear-gradient(180deg,#8a1f3f,#5e1229);border:2px solid var(--bad)}
.atabs button.on{background:linear-gradient(180deg,#ffe066,#ffb31f);color:#2b0f00;border-color:#fff3b0;box-shadow:0 3px 0 #a86a00}
/* Grandes tuiles de modes de jeu */
.kgrid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;background:linear-gradient(160deg,#4a9a38,#2f6b22);padding:6px;border-radius:14px;border:3px solid #8bd36b;box-shadow:inset 0 0 0 2px rgba(0,0,0,.2)}
.kgrid{position:relative;padding-top:30px}
#kcv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;border-radius:11px}
.kt{z-index:1;aspect-ratio:1;min-height:0;padding:0;border-radius:8px;border:2px solid rgba(0,0,0,.25);background:linear-gradient(180deg,color-mix(in srgb,var(--kc) 55%,#fff),var(--kc));box-shadow:0 3px 0 rgba(0,0,0,.3);position:relative;display:flex;align-items:center;justify-content:center}
.kt span{font-size:clamp(14px,5vw,30px);line-height:1}
.kt i{position:absolute;right:2px;bottom:1px;font:700 10px var(--body);color:#fff;text-shadow:0 1px 2px #000;font-style:normal}
.kt.e{background:rgba(255,255,255,.08);border:2px dashed rgba(255,255,255,.18);box-shadow:none}
.kt.e.can{background:rgba(255,255,255,.22);border-color:#fff}
.kt.sel{outline:3px solid #fff;outline-offset:1px}
.kt:not(.e){background:transparent;border-color:transparent;box-shadow:none}
.kt:not(.e) span{visibility:hidden}
.kt.e{border-color:rgba(255,255,255,.12)}
.kbuild{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.kbuild button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:620px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:2px;min-height:112px;padding:12px;border-radius:20px;text-align:left;border:3px solid rgba(255,255,255,.55);background:var(--tg);box-shadow:0 6px 0 var(--ts),inset 0 2px 0 rgba(255,255,255,.4);overflow:hidden;color:#fff}
.tile:active:not(:disabled){box-shadow:0 2px 0 var(--ts)}
.tile .ti{position:absolute;right:8px;top:6px;font-size:38px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25));transform:rotate(-8deg)}
.tile b{font:19px/1.1 var(--display);max-width:100%;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.tile span{font-size:12px;font-weight:700;opacity:.95;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.tile .tb{position:absolute;left:10px;top:10px;background:#fff;color:#2b0f00;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:800}
.hero-stage{background:radial-gradient(circle at 50% 70%,rgba(255,210,63,.35),transparent 60%),linear-gradient(180deg,rgba(78,50,190,.92),rgba(44,26,128,.94))}
html[data-th] .tile{filter:saturate(.95)}
</style>

    if(id==='chaton'){g.fillStyle=P.c1;g.beginPath();g.moveTo(-9,-4);g.lineTo(-7,-15);g.lineTo(-1,-8);g.moveTo(9,-4);g.lineTo(7,-15);g.lineTo(1,-8);g.fill();g.strokeStyle=P.c2;g.lineWidth=2;g.beginPath();g.moveTo(-3,4);g.lineTo(-11,3);g.moveTo(3,4);g.lineTo(11,3);g.stroke()}}

const DNEED=20,dNeed=k=>Math.min(DNEED,ordered(k).length),dGot=k=>ordered(k).filter(r=>S.solved[r.id]).length;
function diffOpen(k){return boss()||k===0||dGot(k-1)>=dNeed(k-1)||ordered(k-1).every(r=>fin(r.id))||ordered(k).some(r=>fin(r.id))}
// Énigme du jour : la prochaine énigme à faire, jouée pour la première fois de la journée
function dailyR(){for(let k=0;k<4;k++){if(!diffOpen(k))break;const r=ordered(k).find(x=>!fin(x.id));if(r)return r}return null}
function ansText(r){if(r.sol)return r.sol;if(r.type==='c')return r.o[+r.a];if(r.type==='n')return String(r.a);if(r.word)return 'le mot « '+r.word+' » dans la question';const i=r.it.find(x=>x.ok);return i?(i.e||i.t):''}

function stat(c,lvl,st,k){return Math.round(c[k]*(1+.08*(lvl-1))*(1+.25*(st-1)))}
function fmt(ms){const s=Math.max(0,Math.ceil(ms/1000));return (s>=3600?Math.floor(s/3600)+' h ':'')+String(Math.floor(s%3600/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// Une seule recette à la fois, qui change toutes les 5 minutes (réglable par l'admin), plus celle d'un événement
const rotMs=()=>(CFG.rotm||5)*60000;
function recipes(){
  let out=[]; const e=ev();
  if(e&&HB[e.a]&&HB[e.b]&&HB[e.out])out.push({a:e.a,b:e.b,out:e.out,ev:1});
  const per=Math.floor(Date.now()/rotMs()),r=rng(per*7919+13);
  const L2=CFG.recipes?.length?CFG.recipes.filter(x=>HB[x.a]&&HB[x.b]&&HB[x.out]):POOL.filter(x=>!x[3]||r()<.3).map(x=>({a:x[0],b:x[1],out:x[2],x:x[4]}));
  if(L2.length)out.push(L2[Math.floor(r()*L2.length)%L2.length]);
  return out;
}

let AC=null,lastHit=0,musT=null,musStep=0;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){AC=null}return AC}
function tone(f,d,type,vol,slide,delay,dest){const a=ac();if(!a)return;const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.06,t+.01);g.gain.exponentialRampToValueAtTime(.0005,t+d);o.connect(g);g.connect(dest||a.destination);o.start(t);o.stop(t+d+.05)}
function noise(d,vol,delay){const a=ac();if(!a)return;const t=a.currentTime+(delay||0),b=a.createBuffer(1,Math.floor(a.sampleRate*d),a.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=(Math.random()*2-1)*(1-i/c.length);
  const s=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=1400;s.buffer=b;g.gain.value=vol||.12;s.connect(f);f.connect(g);g.connect(a.destination);s.start(t)}
function sfx(k){if(!S.snd||!S.snd.fx)return;try{
  if(k==='hit'){const n=performance.now();if(n-lastHit<70)return;lastHit=n;noise(.12,.14);tone(140,.12,'square',.05,60)}
  else if(k==='shoot'){tone(500,.18,'sawtooth',.035,1300)}
  else if(k==='sp'){tone(110,.7,'sawtooth',.07,700);tone(220,.7,'square',.04,1400,.05);noise(.6,.12,.15)}
  else if(k==='ok'){[523,659,784].forEach((f,i)=>tone(f,.18,'triangle',.08,0,i*.08))}
  else if(k==='ko'){[392,330,262].forEach((f,i)=>tone(f,.22,'triangle',.08,0,i*.1))}
  else if(k==='chest'){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.25,'triangle',.07,0,i*.07));noise(.3,.05,.05)}
  else if(k==='lvl'){[392,523,659,784].forEach((f,i)=>tone(f,.3,'square',.05,0,i*.11))}
  else if(k==='win'){[523,659,784,1047].forEach((f,i)=>tone(f,.35,'square',.05,0,i*.13))}
  else if(k==='lose'){[330,294,262,196].forEach((f,i)=>tone(f,.35,'triangle',.07,0,i*.15))}

 }catch(e){}}

  if(m)tone(f(m+12),.28,'triangle',.022);if(musStep%2===0)tone(f(BAS[(musStep>>1)%8]),.5,'sine',.035);musStep++}

   ${eggs.length>30?`<p class="small mute">${eggs.length-30} autres œufs ne sont pas affichés : les boutons ci-dessus s'occupent de tous.</p>`:''}${eggs.length?eggs.slice(0,30).map(e=>{const rd=e.end&&e.end<=now;return `<div class="row"><canvas class="eggc" data-r="${e.r}" data-ok="${rd?1:0}" width="60" height="70" style="width:42px;height:49px;flex:none"></canvas><span class="grow"><b>${EGG[e.r].n}</b><br><span class="small mute">${rd?'Prêt à éclore !':e.end?'Éclot dans '+fmt(e.end-now):'Il faut '+EGG[e.r].t+' min de chaleur'}</span></span>

  <div class="panel"><h2>Ma collection (${Object.keys(own).length} / ${PETS.length})</h2>${PETS.map(P=>own[P.id]?card(P,own[P.id]):`<div class="row" style="opacity:.55"><canvas class="petc" data-pet="${P.id}" data-lv="1" data-lock="1" width="90" height="80" style="width:56px;height:50px;flex:none"></canvas><span class="grow"><b>???</b> <span class="small mute">· ${['œuf commun','œuf rare','œuf épique'][P.r]} ou mieux</span></span></div>`).join('')}</div>`}
/* ================== CONQUÊTE ==================
   10 territoires partagés entre tous (terr/<i>). Pour en prendre un, bats son gardien : le héros de son propriétaire
   (ou un monstre s'il est libre). Chaque territoire rapporte des points par heure à son propriétaire (24 h max à récolter).
   Un territoire qui vient d'être pris est protégé 10 minutes. */
const TERR=[{n:'Plaine des Héros',ic:'🌾',r:14,g:'sylvar'},{n:'Forêt sombre',ic:'🌲',r:18,g:'braskar'},{n:'Marais maudit',ic:'🐸',r:21,g:'tonnerok'},{n:'Port des pirates',ic:'⚓',r:24,g:'givrelame'},{n:'Désert brûlant',ic:'🏜️',r:28,g:'pyralis'},
 {n:'Mine d\'or',ic:'⛏️',r:35,g:'ombrax'},{n:'Tour de glace',ic:'❄️',r:38,g:'drakonir'},{n:'Volcan',ic:'🌋',r:46,g:'aethon'},{n:'Temple oublié',ic:'🛕',r:52,g:'neantis'},{n:'Château céleste',ic:'🏰',r:63,g:'kaelthar'}];
const CQPROT=600000;let TR2={};
function cqTake(i){const T=TR2[i];return T&&T.at&&Date.now()<T.at+CQPROT&&T.u!==uid?T.at+CQPROT-Date.now():0}
function cqEarn(i){const T=TR2[i];if(!T||T.u!==uid)return 0;const since=Math.max(T.at||0,(S.cqc||{})[i]||0),h=Math.min(24,(Date.now()-since)/3.6e6);return Math.floor(h*TERR[i].r)}
function cqWatch(v){const old=TR2;TR2={};for(const k in v||{})TR2[k]=v[k];
  for(const k in old)if(old[k]&&old[k].u===uid&&TR2[k]&&TR2[k].u!==uid)toast('⚔️ '+(cleanN(TR2[k].nick)||'Quelqu\'un')+' t\'a pris '+TERR[k].n+' !');
  if((view==='conq'||view==='kingdom'||view==='home')&&!typing())render()}
function cqPanel(){const mine=TERR.map((t,i)=>i).filter(i=>TR2[i]&&TR2[i].u===uid),earn=mine.reduce((a,i)=>a+cqEarn(i),0),rate=mine.reduce((a,i)=>a+TERR[i].r,0);
  return `<div class="panel" style="border-color:#9be36b"><div class="row"><h2 class="grow">🗺️ Conquête</h2><span class="chip">${mine.length} / ${TERR.length} territoires</span></div>
   <p class="small mute">Prends des territoires en battant leur gardien. Chacun te rapporte des points chaque heure… jusqu'à ce qu'un pote te le reprenne !</p>
   ${mine.length?`<p class="small">Tu gagnes <b>${rate} points / heure</b>.</p>`:''}<div class="row">${earn>0?`<button class="btn" data-a="cqclaim">Récolter ${earn} points</button>`:''}<button class="btn2" data-a="go" data-v="conq">Voir la carte</button></div></div>`}
function conqView(){const mine=TERR.map((t,i)=>i).filter(i=>TR2[i]&&TR2[i].u===uid),earn=mine.reduce((a,i)=>a+cqEarn(i),0);
  return `<div class="panel" style="border-color:#9be36b"><div class="row"><button data-a="go" data-v="kingdom">← Mon royaume</button><h2 class="grow" style="text-align:center">🗺️ Conquête</h2></div>
   <p class="small mute">Bats le gardien d'un territoire pour le prendre : ton héros actif devient son nouveau gardien. Récolte tes points (jusqu'à 24 h d'avance). Un territoire qui vient d'être pris est protégé 10 minutes.</p>
   ${!db?'<p class="mute">Serveur injoignable : la conquête a besoin d\'internet.</p>':''}
   ${earn>0?`<button class="btn" data-a="cqclaim">Récolter ${earn} points</button>`:''}</div>
  <div class="cqg">${TERR.map((t,i)=>{const T=TR2[i],me=T&&T.u===uid,h=T&&Array.isArray(T.h)&&HB[T.h[0]]?T.h:[t.g,Math.min(20,3+i*2),1],pr=cqTake(i);
   return `<div class="panel cqt ${me?'me':''}"><div class="row"><span style="font-size:26px">${t.ic}</span><span class="grow"><b>${t.n}</b><br><span class="small" style="color:var(--gold)">${t.r} pts / heure</span></span></div>
    <div class="row"><div style="width:62px;flex:none">${pt(h[0],+h[2]||1)}</div><span class="small grow">${T?(me?'<b style="color:var(--ok)">À toi ✓</b>':'Propriétaire : <b>'+esc(cleanN(T.nick)||'Joueur')+'</b>'):'Libre · gardé par un monstre'}<br><span class="mute">Gardien : ${HB[h[0]].n} niv. ${+h[1]||1}</span>${me&&cqEarn(i)?'<br><span style="color:var(--gold)">+'+cqEarn(i)+' à récolter</span>':''}</span></div>
    ${me?'':pr?`<button disabled>🛡️ Protégé encore ${fmt(pr)}</button>`:`<button class="btn" data-a="cqatk" data-i="${i}" ${db?'':'disabled'}>⚔️ Attaquer</button>`}</div>`}).join('')}</div>`}
/* ================== SAISON ==================
   Une saison = un mois. On gagne des points de saison en jouant ; tous les 100 points, un palier (30 en tout) avec sa récompense.
   Palier 30 : le héros de la saison. Tout repart à zéro le mois suivant. */
const SEAH=['valkyra','titanor','nebulis'],MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function seaId(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)}
function seaHero(){const d=new Date();return SEAH[(d.getFullYear()*12+d.getMonth())%SEAH.length]}
function sea(){if(!S.sea||S.sea.id!==seaId())S.sea={id:seaId(),sp:0,cl:{}};return S.sea}
function seaAdd(n){if(!ready||gated())return;const z=sea(),before=Math.floor(z.sp/100);z.sp+=n;if(Math.floor(z.sp/100)>before&&before<30)setTimeout(()=>toast('🎟️ Palier '+Math.min(30,Math.floor(z.sp/100))+' de la saison atteint !'),600)}
function seaRew(i){if(i===30)return {k:'hero',ic:'🦸',t:HB[seaHero()].n};if(i===20)return {k:'wep',ic:'🔫',t:'Une arme'};if(i===10||i===25)return {k:'egg2',ic:'🥚',t:'Œuf épique'};
  if(i%5===0)return {k:'egg1',ic:'🥚',t:'Œuf rare'};if(i%4===0)return {k:'box1',ic:'💎',t:'Coffre runique'};if(i%3===0)return {k:'box0',ic:'🎁',t:'Coffre de bronze'};return {k:'pts',ic:'◆',t:(28+10*i)+' points',v:28+10*i}}
function seaDays(){const d=new Date(),e=new Date(d.getFullYear(),d.getMonth()+1,1);return Math.ceil((e-d)/864e5)}
function seaPanel(){const z=sea(),lv=Math.min(30,Math.floor(z.sp/100)),todo=Array.from({length:lv},(_,i)=>i+1).filter(i=>!z.cl[i]).length;
  return `<div class="panel" style="border-color:#ff6ad5"><div class="row"><h2 class="grow">🎟️ Saison de ${MOIS[new Date().getMonth()]}</h2><span class="chip">palier ${lv} / 30</span></div>
   <div class="bar xp"><i style="width:${lv>=30?100:z.sp%100}%;background:#ff6ad5"></i></div><p class="small mute">${lv>=30?'Saison terminée, bravo !':(100-z.sp%100)+' points de saison avant le palier '+(lv+1)} · fin dans ${seaDays()} jour(s) · palier 30 : <b>${HB[seaHero()].n}</b></p>
   <button class="${todo?'btn':'btn2'}" data-a="go" data-v="season">${todo?'Récupérer '+todo+' récompense(s)':'Voir les récompenses'}</button></div>`}
function seasonView(){const z=sea(),lv=Math.min(30,Math.floor(z.sp/100));
  return `<div class="panel" style="border-color:#ff6ad5;text-align:center;align-items:center"><div class="row" style="width:100%"><button data-a="go" data-v="home">← Accueil</button></div><h2>🎟️ Saison de ${MOIS[new Date().getMonth()]}</h2>
   <div style="width:130px" class="${S.chars[seaHero()]?'':'card lock'}">${pt(seaHero(),1)}</div><p><b>${HB[seaHero()].n}</b>, ${HB[seaHero()].ti} : la récompense du palier 30.</p>
   <p class="small mute">Gagne des points de saison en jouant : énigme réussie +10, combat gagné +8, duel gagné +20, vague du donjon +5, mission +15, coffre ouvert +5, fusion +10. Tout repart à zéro le 1er du mois. Fin dans ${seaDays()} jour(s).</p>
   <div class="bar xp" style="width:100%"><i style="width:${lv/30*100}%;background:#ff6ad5"></i></div><b>${z.sp} points de saison · palier ${lv} / 30</b></div>
  <div class="seag">${Array.from({length:30},(_,j)=>{const i=j+1,R=seaRew(i),got=z.cl[i],ok=i<=lv;return `<div class="panel seat ${got?'got':ok?'ok':''}" style="${i%10===0?'border-color:#ff6ad5':''}"><span class="small mute">Palier ${i}</span><span style="font-size:26px">${R.ic}</span><span class="small"><b>${R.t}</b></span>
   ${got?'<span class="small" style="color:var(--ok)">✓ Récupéré</span>':ok?`<button class="btn" data-a="seaclaim" data-i="${i}">Récupérer</button>`:'<span class="small mute">🔒 '+(i*100)+' pts</span>'}</div>`}).join('')}</div>`}
// Grande tuile colorée de l'accueil
function tile(a,v,ic,t,sub2,grad,sh,badge){return `<button class="tile" style="--tg:linear-gradient(160deg,${grad});--ts:${sh}" data-a="${a}" ${v?`data-v="${v}"`:''}><span class="ti">${ic}</span>${badge?`<span class="tb">${badge}</span>`:''}<b>${t}</b><span>${sub2}</span></button>`}

/* ================== MON ROYAUME ==================
   Chaque joueur construit son royaume (8 × 8 cases) avec de l'or produit par ses mines, entraîne des troupes,
   et attaque les royaumes des autres (publiés dans kingdom/<uid>) ou des camps de gobelins.
   Une attaque réussie pille de l'or : l'attaquant écrit raids/<défenseur>/<id>, le défenseur le déduit à sa prochaine visite. */
const KN=8,KB_T=[ // type : nom, icône, coût de construction, PV(l), couleur
 {k:'castle',n:'Château',ic:'🏰',c:0,hp:l=>1500+700*(l-1),col:'#ffd23f'},
 {k:'mine',n:'Mine d\'or',ic:'⛏️',c:150,hp:l=>400+150*(l-1),col:'#f6b73c'},
 {k:'tower',n:'Tour d\'archers',ic:'🗼',c:250,hp:l=>600+250*(l-1),col:'#4ff0ff'},
 {k:'wall',n:'Muraille',ic:'🧱',c:40,hp:l=>500+300*(l-1),col:'#b0a090'},
 {k:'barracks',n:'Caserne',ic:'⛺',c:200,hp:l=>500+150*(l-1),col:'#ff6a3d'},
 {k:'mtower',n:'Tour de mage',ic:'🔮',c:400,hp:l=>550+200*(l-1),col:'#c77dff',ul:3},
 {k:'airdef',n:'Défense anti-dragon',ic:'🎯',c:350,hp:l=>500+180*(l-1),col:'#ff4d6d',ul:2},
 {k:'vault',n:'Coffre-fort',ic:'🏦',c:300,hp:l=>700+250*(l-1),col:'#ffd23f',ul:2}];
const KBB=Object.fromEntries(KB_T.map(b=>[b.k,b]));
// sz : places prises dans la caserne · ul : niveau de château pour l'entraîner · fly : vole au-dessus des murailles · spl : dégâts de zone
const KTROOP={sol:{n:'Soldat',ic:'🗡️',c:15,hp:120,dmg:18,rg:.7,sp:1,col:'#ff9a3d',d:'au corps à corps'},arc:{n:'Archer',ic:'🏹',c:25,hp:70,dmg:14,rg:2.2,sp:1.1,col:'#3ff08f',d:'tire de loin'},
 mage:{n:'Sorcier',ic:'🧙',c:60,hp:200,dmg:55,rg:1.8,sp:.9,col:'#c77dff',sz:2,ul:2,spl:1,d:'boules de feu : abîme aussi les bâtiments autour'},
 dragon:{n:'Dragon',ic:'🐉',c:250,hp:1150,dmg:55,rg:1.2,sp:.8,col:'#ff4d6d',sz:5,ul:4,fly:1,d:'vole au-dessus des murailles, très solide'}};
// Défenses : portée, cadence, dégâts ; spl = dégâts de zone, air = ne vise que les dragons
const KDEF={castle:{rg:170,cd:1.4,dmg:l=>25+10*l,col:'#ffd23f'},tower:{rg:210,cd:1,dmg:l=>30+15*(l-1),col:'#4ff0ff'},
 mtower:{rg:190,cd:1.8,dmg:l=>45+15*(l-1),col:'#c77dff',spl:60},airdef:{rg:240,cd:1,dmg:l=>70+25*(l-1),col:'#ff4d6d',air:1}};
const CASTLE_UP=[0,400,900,1800,3500,5950,10100,17200,29200,49700,84400,143500,244000,415000,705000];
// Or stocké : le double du prix de la prochaine amélioration du château (au niveau max, le double de la dernière)
const kCapL=l=>2*CASTLE_UP[Math.min(14,Math.max(1,+l||1))];
function kdom(){if(!S.kd)S.kd={g:300,b:[{t:'castle',x:3,y:3,l:1},{t:'mine',x:1,y:1,l:1},{t:'tower',x:5,y:2,l:1}],col:Date.now(),tr:{sol:5,arc:0},tro:0,raids:{}};return S.kd}
const kCastle=()=>kdom().b.find(b=>b.t==='castle')||{l:1};
const kCap=()=>kCapL(kCastle().l)+1000*kdom().b.filter(b=>b.t==='vault').reduce((a,b)=>a+b.l,0),kTroopCap=()=>8+6*kdom().b.filter(b=>b.t==='barracks').reduce((a,b)=>a+b.l,0);
const kTroopK=()=>1+.12*(kCastle().l-1);
const kTroops=()=>Object.entries(kdom().tr).reduce((a,[k,n])=>a+n*((KTROOP[k]||{}).sz||1),0);
function kLimit(t){const L=kCastle().l;return t==='castle'?1:t==='mine'||t==='tower'?Math.min(7,L+1):t==='wall'?Math.min(28,4*L+4):t==='mtower'?Math.min(4,Math.max(0,L-2)):t==='airdef'||t==='vault'?Math.min(4,L>=2?L-1:0):Math.min(3,1+Math.floor((L-1)/4))}
const kCount=t=>kdom().b.filter(b=>b.t===t).length+(kdom().inv||[]).filter(b=>b.t===t).length;
function kProd(){return kdom().b.filter(b=>b.t==='mine').reduce((a,b)=>a+80*b.l,0)}
function kPending(){const z=kdom();return Math.max(0,Math.min(kCap()-z.g,Math.floor((Date.now()-(z.col||Date.now()))/3.6e6*kProd())))}
function kUpCost(b){return b.t==='castle'?CASTLE_UP[b.l]||0:b.t==='wall'?60*b.l:Math.round(KBB[b.t].c*b.l*1.5)}
let kPubT=0,kPubTm=0;
function kPub(){if(!db||!uid||gated())return;clearTimeout(kPubTm);const go=()=>{kPubT=Date.now();const z=kdom();db.doc('kingdom/'+uid).set({nick:S.nick||'Joueur',b:z.b.map(b=>[b.t,b.x,b.y,b.l]),l:kCastle().l,g:z.g,p:kProd(),tro:z.tro||0,at:Date.now()}).catch(()=>{})};if(Date.now()-kPubT>8000)go();else kPubTm=setTimeout(go,8000)}
function kSave(){save();kPub()}
// Pillages subis : on les déduit une seule fois
let KREG=[],RAIDS_ME={},RAIDS_ALL={};
function kRaidsIn(v){RAIDS_ME=v||{};const z=kdom();z.raids=z.raids||{};let lost=0,tro=0,who=[];
  for(const id in RAIDS_ME){const r=RAIDS_ME[id];if(!r||z.raids[id])continue;z.raids[id]=1;lost+=Math.max(0,Math.floor(+r.loot||0));tro+=5*(+r.st||0);who.push(cleanN(r.nick)||'Quelqu\'un')}
  if(who.length){z.g=Math.max(0,z.g-lost);z.tro=Math.max(0,(z.tro||0)-tro);kSave();toast('🏰 '+who.join(', ')+' a attaqué ton royaume : -'+lost+' or')}}
function kLastRaid(u,v){let m=0;for(const id in v||{})m=Math.max(m,+(v[id]||{}).at||0);return m}
// Camps de gobelins (cibles d'entraînement, toujours disponibles)
function kGoblin(n){const r=rng(n*977+3),b=[{t:'castle',x:3+Math.floor(r()*2),y:3+Math.floor(r()*2),l:n<=5?n:Math.min(KMAXC,Math.round(n*1.5))}],used=new Set([b[0].x+','+b[0].y]);
  const put=(t,l)=>{for(let k=0;k<40;k++){const x=Math.floor(r()*KN),y=Math.floor(r()*KN);if(!used.has(x+','+y)){used.add(x+','+y);b.push({t,x,y,l});return}}};
  // Camps 6 à 10 : bâtiments de plus haut niveau (jusqu'à 15) pour rester durs face aux grands royaumes
  const lv=n<=5?n:Math.min(KMAXC,Math.round(n*1.5));
  for(let i=0;i<Math.min(7,n+1);i++)put('tower',Math.max(1,lv-1));for(let i=0;i<Math.min(6,n+1);i++)put('mine',lv);for(let i=0;i<Math.min(24,3*n+2);i++)put('wall',lv);for(let i=0;i<(n<=5?(n>=3?1:0):Math.min(4,n-4));i++)put('mtower',Math.max(1,lv-2));for(let i=0;i<(n<=5?(n>=4?1:0):Math.min(4,n-5));i++)put('airdef',Math.max(1,lv-3));
  return {nick:'Camp gobelin '+'I II III IV V VI VII VIII IX X'.split(' ')[n-1],b,l:n,g:n<=5?150+n*250:150+n*n*150,gob:n}}

// ---------- écran du royaume ----------
function kingdomView(){const z=kdom(),pend=kPending(),bt=sub.bt,sel=sub.kb!=null?z.b[sub.kb]:null;
  if(sub.km==='atk')return kAttackList();
  const tiles=[];for(let y=0;y<KN;y++)for(let x=0;x<KN;x++){const i=z.b.findIndex(b=>b.x===x&&b.y===y),b=z.b[i];

// Placement automatique de la réserve : murailles tout autour, défenses près du château, le reste dans les cases libres
function kAuto(z){const inv=z.inv||[],used=new Set(z.b.map(b=>b.x+','+b.y)),c=z.b.find(b=>b.t==='castle')||{x:3,y:3},free=(x,y)=>!used.has(x+','+y);
  const ring=[];for(let x=0;x<KN;x++)ring.push([x,KN-1]);for(let y=KN-2;y>=0;y--)ring.push([KN-1,y]);for(let x=KN-2;x>=0;x--)ring.push([x,0]);for(let y=1;y<KN-1;y++)ring.push([0,y]);
  const inner=[];for(let y=1;y<KN-1;y++)for(let x=1;x<KN-1;x++)inner.push([x,y]);inner.sort((a,b)=>Math.hypot(a[0]-c.x,a[1]-c.y)-Math.hypot(b[0]-c.x,b[1]-c.y));
  const put=(b,spots)=>{for(const [x,y] of spots)if(free(x,y)){used.add(x+','+y);z.b.push({t:b.t,x,y,l:b.l});return true}return false};
  const order=['airdef','mtower','tower','barracks','vault','mine'],left=[];inv.sort((a,b)=>b.l-a.l);
  for(const b of inv.filter(b=>b.t==='wall'))if(!put(b,ring)&&!put(b,inner))left.push(b);
  for(const t of order)for(const b of inv.filter(b=>b.t===t))if(!put(b,t==='mine'||t==='vault'?inner.slice().reverse():inner)&&!put(b,ring))left.push(b);
  for(const b of inv.filter(b=>b.t!=='wall'&&!order.includes(b.t)))if(!put(b,inner)&&!put(b,ring))left.push(b);
  z.inv=left}

// Rend les objets d'une énigme en image déplaçables et vérifie si le joueur a trouvé
// Les 5 différences : l'image du bas est celle du haut avec 5 changements (objet changé, enlevé, ajouté, plus gros, tourné…)
function dfItems(r,k){const L=r.L.map(i=>({...i}));if(!k)return L;const add=[];
  for(const d of r.D){if(d.add){add.push({e:d.add,x:d.x,y:d.y,s:d.s});continue}const i=L[d.i];if(d.e===null){i.hide=1;continue}if(d.e)i.e=d.e;if(d.s)i.s=d.s;if(d.y!=null)i.y=d.y;if(d.r)i.r=d.r;if(d.fl)i.fl=1}
  return L.filter(i=>!i.hide).concat(add)}
function dfPos(r,j){const d=r.D[j];return d.add?{x:d.x,y:d.y}:{x:r.L[d.i].x,y:d.y!=null?(r.L[d.i].y+d.y)/2:r.L[d.i].y}}
function dfBind(){const r=allR().find(x=>x.id===sub.id);if(!r||r.type!=='df')return false;if(sub.res||(fin(r.id)&&!sub.retry))return true;
  document.querySelectorAll('.scene.df').forEach(sc=>{sc.onpointerdown=e=>{const R=sc.getBoundingClientRect(),x=(e.clientX-R.left)/R.width*100,y=(e.clientY-R.top)/R.height*100;sub.df=sub.df||[];
    const j=r.D.findIndex((_,j)=>{const q=dfPos(r,j);return !sub.df.includes(j)&&Math.hypot(x-q.x,(y-q.y)*.625)<9});
    if(j>=0){sub.df.push(j);sfx('ok');if(sub.df.length>=r.D.length){sub.df=[];answer(true)}else render();return}
    sub.dfx=(sub.dfx||0)+1;sfx('ko');try{sc.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}],{duration:200})}catch(_){}
    if(sub.dfx>=10){sub.df=[];answer(false)}else if(sub.dfx>=7)toast('Attention : encore '+(10-sub.dfx)+' erreur(s) et c\'est perdu')}});return true}
function bindScene(){if(dfBind())return;
  const r=allR().find(x=>x.id===sub.id),sc=$('.scene.act');if(!r||!r.act||!sc||sub.res||(fin(r.id)&&!sub.retry))return;
  const taps={};let seq=1;const nseq=r.it.filter(i=>i.o).length;
  sc.querySelectorAll('.it[data-i]').forEach(el=>{const ix=+el.dataset.i,it=r.it[ix];if(it.deco)return;
    let pid=null,sx,sy,ox,oy,moved,lx,dir,flips,holdT=null;
    const wob=()=>{try{el.animate([{transform:'translate(-50%,-50%) scale(1.25)'},{transform:'translate(-50%,-50%) scale(1)'}],{duration:160})}catch(e){}};
    el.onpointerdown=e=>{pid=e.pointerId;try{el.setPointerCapture(pid)}catch(_){}sx=lx=e.clientX;sy=e.clientY;ox=parseFloat(el.style.left);oy=parseFloat(el.style.top);moved=false;dir=0;flips=0;
      if(it.hold){wob();holdT=setTimeout(()=>{holdT=null;pid=null;answer(true)},it.hold*1000)}e.preventDefault()};
    el.onpointermove=e=>{if(e.pointerId!==pid)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(!moved&&Math.hypot(dx,dy)>8){moved=true;clearTimeout(holdT)}
      if(!it.drag||!moved)return;const R=sc.getBoundingClientRect();el.style.left=(ox+dx/R.width*100)+'%';el.style.top=(oy+dy/R.height*100)+'%';
      if(it.shake){const d=e.clientX-lx;if(Math.abs(d)>5){const nd=Math.sign(d);lx=e.clientX;if(dir&&nd!==dir&&++flips>=it.shake){pid=null;answer(true);return}dir=nd}}};
    el.onpointerup=e=>{if(e.pointerId!==pid)return;pid=null;clearTimeout(holdT);
      if(!moved){
        if(it.ok)return answer(true);
        if(it.taps){wob();taps[ix]=(taps[ix]||0)+1;if(taps[ix]>=it.taps)answer(true);return}
        if(it.o){if(it.o===seq){el.classList.add('sel');wob();if(++seq>nseq)answer(true)}else if(it.o>seq)answer(false);return}
        if(it.drag||it.n||it.hold||r.a!=null)return;
        return answer(false)}
      const x=parseFloat(el.style.left),y=parseFloat(el.style.top);
      if(it.out&&(x<0||x>100||y<0||y>100))return answer(true);
      if(it.on!=null){const te=sc.querySelector('[data-i="'+it.on+'"]');if(te&&Math.hypot(x-parseFloat(te.style.left),(y-parseFloat(te.style.top))*.625)<(it.rad||12))answer(true)}};
    el.onpointercancel=()=>{pid=null;clearTimeout(holdT)};
  });
}

    else if(it.op==='rid'){S.solved={};S.failed={};S.hint={};S.streak=0;S.daily=''}
    else if(it.op==='hlvl'&&o){o.lvl=Math.max(1,Math.min(HMAX,o.lvl+v));o.xp=0}
    else if(it.op==='setpts')S.pts=Math.max(0,v);
    else if(it.op==='settot')S.total=Math.max(0,v);
    else if(it.op==='streak')S.streak=Math.max(0,v);
    else if(it.op==='dj')S.dj=v>0?{...(S.dj||{}),best:v,wk:weekId(),wb:v}:{};
    else if(it.op==='adv'){const r=Math.floor(+it.r);if(r<0){S.adv={};S.advU={};if(v<=0)S.advH={};else REG.forEach((R,i)=>{S.adv[i]=R.lv.length;S.advU[i]=1})}
      else if(REG[r]){S.adv={...(S.adv||{}),[r]:Math.max(0,Math.min(REG[r].lv.length,v))};S.advU={...(S.advU||{}),[r]:1}}}
    else if(it.op==='kreset')S.kd=null;
    else if(it.op==='kg')kdom().g=Math.max(0,v);
    else if(it.op==='kcl'){const c=kdom().b.find(b=>b.t==='castle');if(c)c.l=Math.max(1,Math.min(KMAXC,v||1))}
    else if(it.op==='sea')S.sea=null;
    else if(it.op==='hset'&&o){o.lvl=Math.max(1,Math.min(HMAX,v||1));o.st=Math.max(1,Math.min(3,Math.floor(+it.s)||1));o.xp=0}
    else if(it.op==='wipe'){const keep={nick:S.nick,code:S.code,joined:S.joined,lang:S.lang,snd:S.snd,gifted:S.gifted};S=Object.assign(JSON.parse(JSON.stringify(DEF)),keep)}
    else if(it.op==='rmchar'&&o){if(Object.keys(S.chars).length>1){delete S.chars[it.h];if(S.sel===it.h)S.sel=Object.keys(S.chars)[0];if(S.craft&&S.craft.out===it.h&&S.craft.evo)S.craft=null}else{o.n=1;o.lvl=1;o.st=1;o.xp=0}}
  }
  if(n||mod){save();if(mod){cloudSave(1);kPub()}if(view!=='fight'&&view!=='duel')render()}
  if(n)reward(lastH,S.chars[lastH].st,n>1?n+' cadeaux de l\'admin reçus !':'Cadeau de l\'admin !');else if(gp)toast('🎁 Cadeau de l\'admin : +'+gp+' points !');else if(mod)toast('L\'admin a modifié ton compte');
}

let ROSTER={},rosterOk=false;
function ago(t){if(!t)return L('pas encore venu');const m=Math.floor((Date.now()-t)/60000),he=LANG==='he';
  if(m<2)return he?'לפני רגע':'vu à l\'instant';if(m<60)return he?'לפני '+m+' דק׳':'vu il y a '+m+' min';const h=Math.floor(m/60);if(h<24)return he?'לפני '+h+' שע׳':'vu il y a '+h+' h';
  const d=Math.floor(h/24);return he?'לפני '+d+' ימים':'vu il y a '+d+' jour'+(d>1?'s':'')}
function allPlayers(){
  const on=PEERS.filter(p=>!p.sameTab&&p.presence?.nick),used=new Set(),rows=[],seen={},seenN={};
  for(const p of PLAYERS){const t=p.at||0;if(p.cid&&t>(seen[p.cid]||0))seen[p.cid]=t;const k=String(p.nick||'').toLowerCase();if(k&&t>(seenN[k]||0))seenN[k]=t}
  const names=Object.keys(ROSTER).length?Object.entries(ROSTER).map(([cid,r])=>({cid,name:cleanN(r.name)||'Joueur'}))
    :PLAYERS.filter(p=>!p.adm&&p.nick).map(p=>({cid:p.cid||'',name:cleanN(p.nick)||'Joueur',uid:p.id}));
  const dup=new Set();
  for(const r of names){if(myCid&&r.cid===myCid||r.uid===uid)continue;const k=r.cid||r.name.toLowerCase();if(dup.has(k))continue;dup.add(k);
    const p=on.find(x=>!used.has(x.peer)&&(r.cid&&x.presence.cid===r.cid||r.uid&&x.peer===r.uid));if(p)used.add(p.peer);
    const pd=PLAYERS.find(x=>r.cid&&x.cid===r.cid)||PLAYERS.find(x=>x.id===r.uid)||PLAYERS.find(x=>String(x.nick||'').toLowerCase()===r.name.toLowerCase());
    rows.push({name:r.name,p,at:Math.max(seen[r.cid]||0,seenN[r.name.toLowerCase()]||0),uid:p?p.by:pd?.id})}
  // l'admin (pas de code dans la liste) apparaît aussi
  for(const a of PLAYERS)if(a.adm&&a.id!==uid&&!on.some(x=>x.peer===a.id)){rows.push({name:cleanN(a.nick)||'Shai',at:a.at||0,uid:a.id});break}
  for(const p of on)if(!used.has(p.peer))rows.push({name:pname(p),p,at:Date.now(),uid:p.by});
  return rows.sort((a,b)=>(!!b.p-!!a.p)||(b.at-a.at)||a.name.localeCompare(b.name));
}

  for(const id in ROSTER)if(!ids.has(id))db.doc('roster/'+id).delete().catch(()=>{})}
/* ---- Mises à jour automatiques : on compare le code qui tourne sur ce téléphone avec celui du site.

let verT=0;
const codeHash=doc=>{let t='';doc.querySelectorAll('script:not([src])').forEach(x=>t+=x.textContent);let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return h};
const MYVER=codeHash(document);
function freshGo(){try{save();stashProfile()}catch(e){}location.replace(location.pathname+'?v='+Date.now().toString(36))}
async function verCheck(){if(!/^https?:$/.test(location.protocol)||Date.now()-verT<60000)return;verT=Date.now();
  try{const r=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)return;const h=codeHash(new DOMParser().parseFromString(await r.text(),'text/html'));if(h===MYVER)return;
    // Nouvelle version : tout de suite si le joueur n'est pas en plein combat, sinon on lui propose
    const busy=(view==='fight'||view==='duel')&&F&&!F.over||view==='kbattle'&&KB&&!KB.over;let tried=null;try{tried=sessionStorage.getItem('lpver')}catch(e){}
    if(!busy&&tried!==String(h)){try{sessionStorage.setItem('lpver',String(h))}catch(e){}return freshGo()}
    const b=$('#updbar');if(b&&b.hidden){b.innerHTML=`<span>${L('Nouvelle version du jeu disponible')}</span><button class="btn" data-a="reload">${L('Mettre à jour')}</button>`;b.hidden=false}}catch(e){}}
setTimeout(verCheck,1500);setInterval(verCheck,2*60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)verCheck()});

  else if(F&&F.duel)F.rxT=performance.now()});

   ${rows.length?`<div style="max-height:420px;overflow:auto;display:flex;flex-direction:column;gap:8px">${rows.map(row).join('')}</div>`:'<p class="mute">Personne d\'autre pour le moment. Envoie le lien du jeu à tes potes : ils apparaîtront ici.</p>'}</div>`;

function giftList(){const m=new Map(PLAYERS.map(p=>[p.id,{id:p.id,nick:p.nick}]));for(const p of PEERS)if(p.by){const e=m.get(p.by)||{id:p.by};e.nick=pname(p);e.on=1;m.set(p.by,e)}return [...m.values()]}

/* ================== BOUCLE, HORLOGE, DONNÉES PARTAGÉES ================== */
let last=0;
function loop(ts){const t=ts/1000,dt=Math.min(.033,t-last||.016);last=t;try{if(F&&view==='fight')fightTick(dt,t);if(KB&&view==='kbattle')kTick(dt,t);drawPortraits(t);kGridDraw(t)}catch(e){console.error(e)}requestAnimationFrame(loop)}

  if(view==='forge'){const c=S.craft,b=$('#cbtn');if(c&&b){const left=c.end-Date.now();if(left<=0){if(b.disabled)render()}else{b.textContent=fmt(left);$('#cbar').style.width=(1-left/c.dur)*100+'%'}}const r=$('#rot');if(r){const n=nextRot();r.textContent=L('change dans')+' '+fmt(n);if(n>rotMs()-1500&&!S.craft)render()}}
},1000);
async function syncPlayer(){
  if(!db||!uid||syncDead||syncing||!ready||gated())return;
  wkAdd(0);const d={nick:S.nick||'Joueur',ti:myTag(),pts:S.pts,total:S.total,arena:S.arena,heroes:Object.keys(S.chars).length,solved:Object.keys(S.solved).length,wk:S.wk.id,djw:(S.dj||{}).wk||'',djb:(S.dj||{}).wb||0,djr:(S.dj||{}).best||0,wp:S.wk.p,lwk:S.lwk?.id||'',lwp:S.lwk?.p||0,adm:isAdmin?1:0,cid:myCid||'',dw:S.dw||0,dl:S.dl||0,sec:Object.keys(S.sec||{}).length,sel:[S.sel,S.chars[S.sel].lvl,S.chars[S.sel].st],c:Object.entries(S.chars).map(([k,v])=>k+':'+v.n+':'+v.lvl+':'+v.st).join(',').slice(0,900)},sig=JSON.stringify(d);

// Blocage temporaire : codes/<id>.blk = heure de fin. Rien n'est effacé, le joueur retrouve tout en remettant son code après
const blkOn=x=>(+(x&&x.blk)||0)>Date.now();let BLKMSG='';
function hhmm(t){const d=new Date(t);return d.toDateString()===new Date().toDateString()?d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):d.toLocaleString('fr-FR',{weekday:'long',hour:'2-digit',minute:'2-digit'})}

async function codeId(code){const en=new TextEncoder(),k=await crypto.subtle.importKey('raw',en.encode(code),'PBKDF2',false,['deriveBits']),b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:en.encode('legendes-pieges-v1'),iterations:60000,hash:'SHA-256'},k,128);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function watchCode(){if(!db||!S.code)return;try{const id=await codeId(S.code);myCid=id;pushPres();cloudLoad();if(codeUnsub)codeUnsub();
  codeUnsub=db.doc('codes/'+id).onSnapshot(s=>{if(s.metadata&&s.metadata.fromCache)return;

    else if(blkOn(s.data())){cloudSave(1);stashProfile();BLKMSG=blkMsg(s.data().blk);if(codeUnsub){codeUnsub();codeUnsub=null}

  }

}
