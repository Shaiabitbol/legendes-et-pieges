<title>Légendes et Pièges</title>

<style>
/* Layout : une console de jeu — bandeau de stats en haut, scène au centre, barre d'onglets fixe en bas. */
:root{
  --night:#0e1024; --deep:#171a3a; --panel:#1f2350; --line:#353b7a; --ink:#eef0ff; --mute:#a3a8d6;
  --ember:#ff8a3d; --gold:#ffd166; --arc:#5ee6ff; --ok:#5dd39e; --bad:#ff5d73;
  --display:'Russo One','Arial Black',Impact,sans-serif; --body:'Chakra Petch','Trebuchet MS',Verdana,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%}
body{background:radial-gradient(120% 80% at 50% 0%,#232863 0%,var(--night) 60%) fixed,var(--night);color:var(--ink);font:16px/1.45 var(--body)}
#app{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:10px 96px;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.logo{font:22px/1 var(--display);letter-spacing:.5px;text-shadow:0 0 18px rgba(94,230,255,.45)}
.logo b{color:var(--ember);font-weight:400}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--deep);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
#invbar{background:#123a4d;border:1px solid var(--arc);border-radius:10px;padding:8px 12px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:center}.duo>div{display:flex;flex-direction:column;gap:4px;min-width:0}.flip{transform:scaleX(-1)}
.mvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.mvs button{display:flex;flex-direction:column;gap:2px;align-items:center}.mvs small{font-weight:400;color:var(--mute);font-size:12px}
:root[lang=he]{--display:'Rubik','Arial Hebrew',Arial,sans-serif;--body:'Rubik','Arial Hebrew',Arial,sans-serif}
:root[lang=he] h1,:root[lang=he] h2,:root[lang=he] h3,:root[lang=he] .q,:root[lang=he] .card .nm{font-weight:800}
[dir=rtl] .pad,[dir=rtl] .fhud,[dir=rtl] .duo,[dir=rtl] .recipe,[dir=rtl] .scene,[dir=rtl] .logo{direction:ltr}
[dir=rtl] .opts button{text-align:right}
#hlang{min-height:0;padding:4px 12px;cursor:pointer;color:var(--arc)}
.fhud{grid-template-columns:1fr auto 1fr!important;align-items:start}
#fwrap{display:flex;flex-direction:column;gap:12px}
#fwrap.fs{position:fixed;inset:0;z-index:30;background:#05060f;display:block}
.fs #arena{position:absolute;inset:0;width:100%;height:100%;max-height:none;border:0;border-radius:0;object-fit:contain}
.fs .fhud{position:absolute;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 14px;z-index:2;background:linear-gradient(rgba(5,6,15,.85),rgba(5,6,15,0))}
.fs .pad{position:absolute;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:0 16px;z-index:2;pointer-events:none}
.fs .pad>*{pointer-events:auto;opacity:.82}
.fs #fres{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:3;pointer-events:none}
.fs #fres>*{pointer-events:auto;max-width:420px}
#bsp.rdy{box-shadow:0 0 20px #c77dff;animation:pulse .6s infinite alternate}
@keyframes pulse{to{filter:brightness(1.8)}}
.code{font:700 17px ui-monospace,Menlo,Consolas,monospace;letter-spacing:2px;color:var(--gold);user-select:all;-webkit-user-select:all}
.chip.pts{color:var(--gold);border-color:#7a6230}
#evbar{background:linear-gradient(90deg,#5b1d4f,#8a2d2d,#5b1d4f);background-size:200% 100%;animation:slide 6s linear infinite;border:1px solid var(--ember);border-radius:10px;padding:8px 12px;font-weight:700;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
@keyframes slide{to{background-position:200% 0}}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.4px}
h2{font-size:20px}h3{font-size:16px}
p{margin:0}
.mute{color:var(--mute)}.small{font-size:13px}
.panel{background:linear-gradient(180deg,rgba(31,35,80,.95),rgba(23,26,58,.95));border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.split{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:720px){.split{grid-template-columns:1fr 1fr}}
button{font:700 15px var(--body);color:var(--ink);cursor:pointer;border:1px solid var(--line);background:var(--deep);border-radius:10px;padding:10px 14px;min-height:42px}
button:hover:not(:disabled){border-color:var(--arc)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--arc);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.btn{background:linear-gradient(180deg,#ffa35a,#e2622a);border-color:#ffc08a;color:#22100a;text-shadow:none;box-shadow:0 4px 0 #8b3413}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #8b3413}
.btn2{background:linear-gradient(180deg,#3fd4f2,#1f8fc4);border-color:#a5f0ff;color:#04202c;box-shadow:0 4px 0 #0f5578}
input,select,textarea{font:16px var(--body);color:var(--ink);background:#10122b;border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;max-width:100%}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute);font-weight:600;min-width:0}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(14,16,36,.96);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:4px;z-index:20}
nav button{flex:1;max-width:150px;min-width:0;padding:8px 2px;font-size:13px;border-color:transparent;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mute)}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--gold);background:var(--deep);border-color:var(--line)}
canvas.pt{width:100%;max-width:160px;aspect-ratio:18/19;display:block;margin:0 auto}
.card{position:relative;background:linear-gradient(180deg,#262b63,#161938);border:2px solid var(--rc,var(--line));border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:4px;text-align:center;cursor:pointer;min-height:0;font-weight:600}
.card.sel{box-shadow:0 0 0 2px var(--gold),0 0 22px rgba(255,209,102,.45)}
.card.lock canvas{filter:brightness(.18) saturate(0)}
.card .nm{font:15px var(--display)}
.rar{color:var(--rc);font-size:12px;text-transform:uppercase;letter-spacing:1.2px;font-weight:700}
.stars{color:var(--gold);letter-spacing:2px}
.bar{height:12px;background:#0b0c1e;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:50%;background:var(--ok);transition:width .12s}
.bar.en i{background:linear-gradient(90deg,#2aa7ff,var(--arc))}.bar.sh{height:6px}.bar.sh i{background:var(--gold)}
.bar.xp i{background:linear-gradient(90deg,#b06cff,#ff7ad9)}
.diff{display:flex;gap:6px;flex-wrap:wrap}
.diff button.on{background:var(--panel);border-color:var(--gold);color:var(--gold)}
.rid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.rid button{aspect-ratio:1;font:20px var(--display);padding:0}
.rid button.done{background:#1d4a3c;border-color:var(--ok);color:var(--ok)}
.rid button.fail{background:#4a1a26;border-color:var(--bad);color:var(--bad)}
.rid button:disabled.done,.rid button:disabled.fail{opacity:1}
.good{outline:3px solid var(--ok)!important;outline-offset:2px;opacity:1!important;border-radius:8px}
.scene.act,.scene.act .it{touch-action:none}.scene.act .it{cursor:grab}.it.sel{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
.rid button.day{border-color:var(--gold);box-shadow:0 0 14px rgba(255,209,102,.5)}
.q{font:20px/1.3 var(--display);text-wrap:balance}
.q .w{font:inherit;padding:0 2px;min-height:0;border:none;background:none;display:inline;color:inherit;cursor:pointer}
.opts{display:grid;gap:8px;grid-template-columns:1fr}
@media(min-width:560px){.opts{grid-template-columns:1fr 1fr}}
.opts button{text-align:left;font-size:16px}
.scene{position:relative;aspect-ratio:16/10;border-radius:12px;overflow:hidden;border:1px solid var(--line);container-type:inline-size;max-width:100%}
.scene.plage{background:linear-gradient(#58c7ff 0 45%,#1b7fc4 45% 62%,#f0d08a 62%)}
.scene.savane{background:linear-gradient(#ffcf7a 0 55%,#b98a3c 55%)}
.scene.nuit{background:linear-gradient(#0b1030,#2a2060 70%,#1b3a2a 70%)}
.scene.labo{background:repeating-linear-gradient(90deg,#20264f 0 40px,#252c5c 40px 80px)}
.it{position:absolute;transform:translate(-50%,-50%);font-size:calc(var(--s)*1cqw);line-height:1;background:none;border:none;padding:0;min-height:0;cursor:pointer}
.it.t{font-family:var(--display);padding:2cqw 4cqw;border-radius:2cqw;color:#fff;border:2px solid #fff}
.res{border-radius:10px;padding:10px 12px;font-weight:700}
.res.ok{background:#17402f;border:1px solid var(--ok)}.res.ko{background:#4a1a26;border:1px solid var(--bad)}
#arena{width:100%;aspect-ratio:16/9;display:block;border-radius:12px;border:1px solid var(--line);background:#090a18;max-height:62vh;margin:0 auto;touch-action:none}
.fhud{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fhud>div{display:flex;flex-direction:column;gap:3px;min-width:0}
.fhud .r{text-align:right}.fhud .r .bar i{margin-left:auto}
.pad{display:flex;justify-content:space-between;align-items:center;gap:10px;touch-action:none;user-select:none;-webkit-user-select:none}
#joy{width:118px;height:118px;border-radius:50%;background:radial-gradient(#2a2f6a,#14173a);border:2px solid var(--line);position:relative;flex:none;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;background:radial-gradient(#8ff0ff,#2a8fc0);box-shadow:0 0 16px var(--arc)}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,74px));gap:8px;touch-action:none}
.acts button{aspect-ratio:1;border-radius:50%;padding:0;font-size:12px;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;touch-action:none}
.acts button kbd{font:11px var(--body);color:var(--mute)}
.acts .a1{background:#7a2b22;border-color:var(--ember)}.acts .a2{background:#134a66;border-color:var(--arc)}
.acts .a3{background:#5a4712;border-color:var(--gold)}.acts .a4{background:#1d4a3c;border-color:var(--ok)}.acts .a5{background:#4b1e66;border-color:#c77dff}
.acts button.dn{filter:brightness(1.6)}
.recipe{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:4px;text-align:center;font:20px var(--display)}
.recipe canvas{max-width:92px}
.mach{background:radial-gradient(circle at 50% 30%,#3a2a6e,#151734);border:2px solid #7c5cff;box-shadow:inset 0 0 40px rgba(124,92,255,.35)}
.mach.run canvas{animation:spin 1.2s ease-in-out infinite alternate}
@keyframes spin{to{transform:scale(.86) rotate(6deg);filter:brightness(1.8)}}
#modal{position:fixed;inset:0;background:rgba(6,7,18,.86);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
#modal .panel{max-width:360px;width:100%;text-align:center;align-items:center;border-color:var(--rc,var(--gold));box-shadow:0 0 60px var(--rc,var(--gold));animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000;border:1px solid var(--gold);color:var(--gold);padding:8px 16px;border-radius:999px;font-weight:700;z-index:50;max-width:90vw;text-align:center}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.tw{overflow-x:auto}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function recipes(){
  let out=[]; const e=ev();
  if(e&&HB[e.a]&&HB[e.b]&&HB[e.out])out.push({a:e.a,b:e.b,out:e.out,ev:1});
  if(CFG.recipes?.length)return out.concat(CFG.recipes.filter(r=>HB[r.a]&&HB[r.b]&&HB[r.out]));
  const per=Math.floor(Date.now()/((CFG.rot||60)*60000)), r=rng(per*7919+13);
  const pool=POOL.filter(p=>!p[3]||r()<.25).map(p=>[r(),p]).sort((x,y)=>x[0]-y[0]).slice(0,3);
  return out.concat(pool.map(([,p])=>({a:p[0],b:p[1],out:p[2]})));
}

// Rend les objets d'une énigme en image déplaçables et vérifie si le joueur a trouvé
function bindScene(){
  const r=allR().find(x=>x.id===sub.id),sc=$('.scene.act');if(!r||!r.act||!sc||sub.res||(fin(r.id)&&!sub.retry))return;
  const taps={};let seq=1;const nseq=r.it.filter(i=>i.o).length;
  sc.querySelectorAll('.it[data-i]').forEach(el=>{const ix=+el.dataset.i,it=r.it[ix];if(it.deco)return;
    let pid=null,sx,sy,ox,oy,moved,lx,dir,flips,holdT=null;
    const wob=()=>{try{el.animate([{transform:'translate(-50%,-50%) scale(1.25)'},{transform:'translate(-50%,-50%) scale(1)'}],{duration:160})}catch(e){}};
    el.onpointerdown=e=>{pid=e.pointerId;try{el.setPointerCapture(pid)}catch(_){}sx=lx=e.clientX;sy=e.clientY;ox=parseFloat(el.style.left);oy=parseFloat(el.style.top);moved=false;dir=0;flips=0;
      if(it.hold){wob();holdT=setTimeout(()=>{holdT=null;pid=null;answer(true)},it.hold*1000)}e.preventDefault()};
    el.onpointermove=e=>{if(e.pointerId!==pid)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(!moved&&Math.hypot(dx,dy)>8){moved=true;clearTimeout(holdT)}
      if(!it.drag||!moved)return;const R=sc.getBoundingClientRect();el.style.left=(ox+dx/R.width*100)+'%';el.style.top=(oy+dy/R.height*100)+'%';
      if(it.shake){const d=e.clientX-lx;if(Math.abs(d)>5){const nd=Math.sign(d);lx=e.clientX;if(dir&&nd!==dir&&++flips>=it.shake){pid=null;answer(true);return}dir=nd}}};
    el.onpointerup=e=>{if(e.pointerId!==pid)return;pid=null;clearTimeout(holdT);
      if(!moved){
        if(it.ok)return answer(true);
        if(it.taps){wob();taps[ix]=(taps[ix]||0)+1;if(taps[ix]>=it.taps)answer(true);return}
        if(it.o){if(it.o===seq){el.classList.add('sel');wob();if(++seq>nseq)answer(true)}else if(it.o>seq)answer(false);return}
        if(it.drag||it.n||it.hold||r.a!=null)return;
        return answer(false)}
      const x=parseFloat(el.style.left),y=parseFloat(el.style.top);
      if(it.out&&(x<0||x>100||y<0||y>100))return answer(true);
      if(it.on!=null){const te=sc.querySelector('[data-i="'+it.on+'"]');if(te&&Math.hypot(x-parseFloat(te.style.left),(y-parseFloat(te.style.top))*.625)<(it.rad||12))answer(true)}};
    el.onpointercancel=()=>{pid=null;clearTimeout(holdT)};
  });
}

function reward(id,st,title){const c=HB[id],R=RAR[c.r];const m=$('#modal');m.hidden=false;
  m.innerHTML=`<div class="panel" style="--rc:${R.c}"><div class="rar" style="--rc:${R.c}">${R.n}</div><div style="width:190px">${pt(id,st)}</div><h2>${c.n} ${stars(st)}</h2><p>${title}</p><button class="btn" data-a="close">Continuer</button></div>`}
function answer(ok){
  const r=allR().find(x=>x.id===sub.id);if(r&&sub.retry&&!sub.res&&S.failed[r.id]){sub.res=ok?'ok':'ko';sub.pts=0;render();return}
  if(!r||sub.res||fin(r.id)||locked(r))return;
  const isDay=S.daily!==today()&&dailyR()?.id===r.id;if(isDay)S.daily=today();
  if(!ok){S.streak=0;S.failed[r.id]=1;sub.res='ko';save();render();return}
  const p=gain(DPTS[r.d]*(1+Math.min(S.streak,10)*.1)*mult()*(isDay?3:1)*(S.hint[r.id]?.5:1));
  S.solved[r.id]=1;S.streak++;sub.res='ok';sub.pts=p;save();render();
}

function bindPad(){
  Object.keys(inp).forEach(k=>inp[k]=0);
  const joy=$('#joy'),knob=$('#knob');let id=null;
  const mv=e=>{const r=joy.getBoundingClientRect();let x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;const d=Math.hypot(x,y),m=42;if(d>m){x*=m/d;y*=m/d}knob.style.transform=`translate(${x}px,${y}px)`;inp.x=Math.abs(x)<8?0:x/m;inp.y=Math.abs(y)<8?0:y/m};
  joy.onpointerdown=e=>{id=e.pointerId;try{joy.setPointerCapture(id)}catch(_){}mv(e);e.preventDefault()};
  joy.onpointermove=e=>{if(e.pointerId===id)mv(e)};
  joy.onpointerup=joy.onpointercancel=e=>{if(e.pointerId!==id)return;id=null;knob.style.transform='';inp.x=inp.y=0};
  document.querySelectorAll('.acts [data-k]').forEach(b=>{const k=b.dataset.k,on=e=>{inp[k]=1;b.classList.add('dn');e.preventDefault()},off=()=>{inp[k]=0;b.classList.remove('dn')};
    b.onpointerdown=on;b.onpointerup=b.onpointercancel=b.onpointerleave=off;b.oncontextmenu=e=>e.preventDefault()});
}

let PR=null,room=null,PEERS=[],ME=null,DU=null,INV=null,refused={},presSig='',betSel=0,peerSig='';
const MV={F:['Frapper','Gratuit'],T:['Tirer','Dégâts ×1,4 · 15 énergie'],B:['Bouclier','Dégâts reçus −50 % · pas 2 fois de suite'],R:['Recharger','+40 énergie · +20 % de dégâts reçus'],S:['Spécial','Dégâts ×3,2 · énergie pleine']};
function myH(){const o=S.chars[S.sel];return [S.sel,o.lvl,o.st]}
function pname(p){return String(p?.presence?.nick||'Joueur').replace(/[^\p{L}\p{N} _.\-']/gu,'').slice(0,16)||'Joueur'}
function pushPres(){if(!room||!ready||gated())return;const p={nick:(S.nick||'Joueur').replace(/[^\p{L}\p{N} _.\-']/gu,'').slice(0,16)||'Joueur',tot:S.total,pts:S.pts,h:myH(),cid:myCid||null,a:S.arena,c:Object.entries(S.chars).map(([k,v])=>k+':'+v.n+':'+v.lvl+':'+v.st).join(',').slice(0,900),sv:Object.keys(S.solved).join(',').slice(0,900),fl:Object.keys(S.failed).join(',').slice(0,900)};const s=JSON.stringify(p);if(s===presSig)return;presSig=s;room.presence(p).catch(()=>{})}
function setD(d){if(room)room.presence({d}).catch(()=>{})}
function pubD(x){const d={to:DU.to,bet:DU.bet,sd:DU.sd,mv:DU.mv,h:DU.h};if(x)d.x=x;setD(d)}
function fz(h){const c=HB[h&&h[0]]||HB.braskar,l=Math.max(1,Math.min(20,Math.floor(+(h&&h[1])||1))),st=Math.max(1,Math.min(3,Math.floor(+(h&&h[2])||1)));return {c,l,st,mhp:stat(c,l,st,'hp'),atk:stat(c,l,st,'atk'),men:c.en}}
function sim(h1,h2,m1,m2,sd){
  const P=[fz(h1),fz(h2)],hp=[P[0].mhp,P[1].mhp],en=[Math.round(P[0].men/2),Math.round(P[1].men/2)],prev=['',''],log=[],n=Math.min(m1.length,m2.length,40),r=rng(sd|0);let over=false,win=null;
  for(let i=0;i<n&&!over;i++){
    const m=[m1[i],m2[i]].map((x,k)=>(x==='T'&&en[k]>=15)||(x==='S'&&en[k]>=P[k].men)||(x==='B'&&prev[k]!=='B')||x==='R'?x:'F'),dm=[0,0],raw=[0,0];
    for(let k=0;k<2;k++){const o=1-k,b={F:1,T:1.4,S:3.2}[m[k]]||0;if(m[k]==='T')en[k]-=15;if(m[k]==='S')en[k]=0;dm[o]=Math.round(b*P[k].atk*2*(.9+.2*r())*(m[o]==='B'?.5:m[o]==='R'?1.2:1))}
    for(let k=0;k<2;k++){if(m[k]==='R')en[k]+=40;en[k]=Math.min(P[k].men,en[k]+5);raw[k]=hp[k]-dm[k];hp[k]=Math.max(0,raw[k]);prev[k]=m[k]}
    log.push({m,dm});
    if(hp[0]<=0||hp[1]<=0||i===39){over=true;const a=raw[0]/P[0].mhp,b=raw[1]/P[1].mhp;win=a===b?-1:a>b?0:1}
  }
  return {P,hp,en,prev,log,over,win,n:log.length};
}
function duelSim(){const f=DU.me<DU.to,r=sim(f?DU.h:DU.oh,f?DU.oh:DU.h,f?DU.mv:DU.om,f?DU.om:DU.mv,DU.sd);r.me=f?0:1;return r}
function finishDuel(res){if(!DU||DU.s==='done')return;DU.s='done';DU.res=res;const b=DU.bet,w=res==='win'||res==='forf';if(w){S.pts+=2*b;S.total+=b;S.wins++}else if(res==='draw')S.pts+=b;S.esc=null;addXp(S.sel,w?30:10);save();view='duel';sub={};render()}
function endInvite(msg){if(!DU)return;S.pts+=DU.bet;S.esc=null;refused[DU.to+DU.sd]=1;DU=null;setD(null);save();toast(msg);view='fprep';render()}
function resolveDuel(){
  if(!DU||DU.s!=='play')return;const r=duelSim();
  if(r.over)return finishDuel(r.win===-1?'draw':r.win===r.me?'win':'lose');
  if(DU.gone&&Date.now()-DU.gone>6000)return finishDuel('forf');
  if(r.n!==DU.n){DU.n=r.n;DU.rt=Date.now();DU.claim=0}
  const sig=r.n+':'+DU.mv.length+':'+DU.om.length;if(sig!==DU.sig){DU.sig=sig;if(view==='duel')render()}
}
function roomTick(){
  PEERS=room.peers().filter(p=>p.kind==='viewer');ME=PEERS.find(p=>p.sameTab)||null;if(!ME)return;
  if(DU){const op=PEERS.find(p=>p.peer===DU.to),od=op?.presence?.d,linked=!!od&&od.to===DU.me&&od.sd===DU.sd;
    if(DU.s==='wait'){if(!op)endInvite('Ce joueur est parti');else if(linked){if(od.x)endInvite('Défi refusé');else{DU.s='play';DU.oh=od.h;DU.rt=Date.now();S.esc={bet:DU.bet,st:'play'};save();view='duel';render()}}}
    else if(DU.s==='play'){
      if(linked){DU.gone=0;DU.om=String(od.mv||'').slice(0,40).replace(/[^FTBRS]/g,'F');if(od.x===1)finishDuel('forf');else if(od.x===2)finishDuel('lose')}
      else if(!DU.gone)DU.gone=Date.now();
      resolveDuel()}
  }
  tradeTick();seenSync();
  INV=null;if(!DU)for(const p of PEERS){const d=p.presence?.d;if(!p.sameTab&&d&&d.to===ME.peer&&!d.x&&d.mv===''&&!refused[p.peer+d.sd]){INV=p;break}}
  drawInv();
  const sg=PEERS.map(p=>p.peer+pname(p)+(p.presence?.d?1:0)+(p.presence?.h||'')+(p.presence?.c||'')+(p.presence?.pts||0)+(p.presence?.a||0)).join('|');if(sg!==peerSig){peerSig=sg;if(view==='fprep'||((view==='admin'||view==='heroes'||view==='home')&&!typing()))render()}
}
function drawInv(){const b=$('#invbar');if(!ready||gated()){INV=null;TINV=null}b.hidden=!INV&&!TINV;let h='';
  if(INV)h+=`<span>${esc(pname(INV))} te défie en duel · mise ${Math.max(0,Math.floor(+INV.presence.d.bet||0))} points</span><span class="row"><button class="btn" data-a="dacc">Accepter</button><button data-a="dref">Refuser</button></span>`;
  if(TINV){const t=TINV.presence.tr;h+=`<span>${esc(pname(TINV))} te propose ${HB[t.g].n} contre ton ${HB[t.w].n}</span><span class="row"><button class="btn" data-a="tacc">Accepter</button><button data-a="tref">Refuser</button></span>`}
  if(h!==b.dataset.h){b.dataset.h=h;b.innerHTML=h}}

function parseC(str){const o={};String(str||'').split(',').slice(0,20).forEach(x=>{const [id,n,l,st]=x.split(':');if(HB[id]&&+n>0)o[id]={n:Math.min(99,Math.floor(+n)),lvl:Math.max(1,Math.min(20,Math.floor(+l)||1)),st:Math.max(1,Math.min(3,Math.floor(+st)||1))}});return o}
function takeHero(id){const o=S.chars[id];if(!o)return false;if(o.n>1){o.n--;return true}if(Object.keys(S.chars).length<2)return false;delete S.chars[id];if(S.sel===id)S.sel=Object.keys(S.chars)[0];if(S.craft&&S.craft.out===id&&S.craft.evo)S.craft=null;return true}
function tradeTick(){
  if(TR){const op=PEERS.find(p=>p.peer===TR.to),t=op?.presence?.tr;
    if(!op){TR=null;setT(null);toast('Ce joueur est parti');if(view==='heroes')render()}
    else if(t&&t.to===ME.peer&&t.sd===TR.sd){
      if(t.x){TR=null;setT(null);toast('Échange refusé');if(view==='heroes')render()}
      else if(t.ok&&!S.trd[TR.sd]){S.trd[TR.sd]=1;const g=TR.g,w=TR.w;TR=null;setTimeout(()=>{if(!TR)setT(null)},3000);
        if(takeHero(g)){give(w);save();if(view!=='fight'&&view!=='duel')render();reward(w,S.chars[w].st,'Échange réussi !')}else{save();toast('Échange impossible : ce héros n\'est plus disponible')}}}}
  TINV=null;if(!TR&&ME)for(const p of PEERS){const t=p.presence?.tr;if(!p.sameTab&&t&&t.to===ME.peer&&!t.x&&!t.ok&&HB[t.g]&&HB[t.w]&&!S.trd[t.sd]&&!refused['t'+p.peer+t.sd]){TINV=p;break}}
}

     <label class="grow">Tu reçois<select id="tw">${Object.entries(th).map(([id,o])=>`<option value="${id}">${HB[id].n} ×${o.n}</option>`).join('')}</select></label></div>
     <div class="row"><button class="btn" data-a="tsend">Proposer l'échange</button><button data-a="tclose">Annuler</button></div>`}
  else body=others.length?others.map(p=>`<div class="row"><span class="grow"><b>${esc(pname(p))}</b> <span class="mute small">· ${Object.keys(parseC(p.presence.c)).length} / ${H.length}</span></span><button class="btn2" data-a="topen" data-p="${esc(p.peer)}">Échanger</button></div>`).join(''):'<p class="mute">Personne d\'autre n\'est en ligne pour le moment.</p>';
  return `<div class="panel" id="trp" style="border-color:var(--arc)"><h2>Échanges entre joueurs</h2><p class="mute small">Échange un de tes héros contre celui d'un joueur connecté. Le héros reçu arrive au niveau 1. Si tu donnes ton dernier exemplaire, tu perds ce héros et ses niveaux.</p>${body}</div>`;
}
/* ---- comptes des joueurs vus par l'admin, et modifications envoyées aux joueurs ---- */
function seenSync(){
  if(!isAdmin||!db)return;
  for(const p of PEERS){const q=p.presence||{};if(!p.by||!q.cid||p.sameTab)continue;
    const rec={nick:pname(p),cid:String(q.cid).slice(0,40),pts:Math.floor(+q.pts||0),tot:Math.floor(+q.tot||0),a:Math.floor(+q.a||1),c:String(q.c||'').slice(0,900),sv:String(q.sv||'').slice(0,900),fl:String(q.fl||'').slice(0,900)},sg=JSON.stringify(rec),w=seenW[p.by]||{};
    if(sg!==w.sg&&Date.now()-(w.t||0)>20000&&!w.busy){const st=seenW[p.by]={sg,t:Date.now(),busy:1};db.doc('adm/seen/p/'+p.by).set({...rec,at:Date.now()}).catch(()=>{st.sg=''}).finally(()=>{st.busy=0})}}
}
function plRecs(cid){const m=new Map();for(const k in SEEN)if(SEEN[k].cid===cid)m.set(k,{uid:k,...SEEN[k]});
  for(const p of PEERS){const q=p.presence||{};if(p.by&&q.cid===cid)m.set(p.by,{uid:p.by,nick:pname(p),cid,pts:Math.floor(+q.pts||0),tot:Math.floor(+q.tot||0),a:Math.floor(+q.a||1),c:q.c,sv:q.sv,fl:q.fl,on:1})}return [...m.values()]}
function plPanel(){
  const c=CODES.find(x=>x.id===sub.pv);if(!c)return '';const recs=plRecs(c.id),cnt=x=>String(x||'').split(',').filter(Boolean).length;
  return `<div class="panel" style="border-color:var(--gold)"><div class="row"><h2 class="grow">Compte de ${esc(c.name)}</h2><button data-a="pclose">Fermer</button></div><p class="small mute">Code : <span class="code">${esc(c.code)}</span></p>
  ${recs.length?recs.map(P=>{const ch=parseC(P.c),u=esc(P.uid);return `<div class="panel"><p><b>${esc(P.nick)}</b> · ${P.on?'<span style="color:var(--ok)">en ligne maintenant</span>':'hors ligne, vu le '+new Date(P.at||0).toLocaleString('fr-FR')}</p>
   <p>Points : <b>${P.pts}</b> · gagnés au total : <b>${P.tot}</b> · étage d'arène : <b>${P.a}</b></p><p>Énigmes réussies : <b>${cnt(P.sv)}</b> · ratées : <b>${cnt(P.fl)}</b></p>
   <div class="row"><label class="grow">Points<input id="ap_${u}" type="number" min="1" value="50"></label><button data-a="pcmd" data-u="${u}" data-op="pts" data-s="-1">Retirer</button><button data-a="pcmd" data-u="${u}" data-op="pts" data-s="1">Ajouter</button></div>
   <div class="row"><label class="grow">Étage d'arène<input id="aa_${u}" type="number" min="1" value="${P.a}"></label><button data-a="pcmd" data-u="${u}" data-op="arena">Changer l'étage</button></div>
   <div><button data-a="pcmd" data-u="${u}" data-op="rid">Remettre ses énigmes à zéro</button></div>
   <div class="tw"><table><tr><th>Héros</th><th>Ex.</th><th>Niv.</th><th>★</th><th></th></tr>${Object.entries(ch).map(([id,o])=>`<tr><td>${HB[id].n}</td><td>${o.n}</td><td>${o.lvl}</td><td>${o.st}</td><td><button data-a="pcmd" data-u="${u}" data-op="hlvl" data-h="${id}" ${o.lvl<=1?'disabled':''}>−1 niveau</button> <button data-a="pcmd" data-u="${u}" data-op="rmchar" data-h="${id}">Retirer</button></td></tr>`).join('')}</table></div></div>`}).join('')
   :'<p class="mute">Pas encore d\'infos : ce joueur ne s\'est pas connecté pendant que tu avais le jeu ouvert.</p>'}
  <p class="small mute">Un changement s'applique tout de suite si le joueur est en ligne, sinon à sa prochaine connexion. Les infos d'un joueur hors ligne datent de la dernière fois où vous étiez connectés en même temps.</p></div>`;
}
async function sendCmd(pid,item){const ref=db.doc('gifts/'+pid),s=await ref.get(),items=(s.exists?s.data().items||[]:[]).slice(-40).concat({...item,k:Date.now().toString(36)+Math.random().toString(36).slice(2,6)});await ref.set({items})}
function applyCmds(items){
  S.gifted=S.gifted||{};let lastH=null,n=0,mod=0;
  for(const it of items||[]){if(!it||!it.k||S.gifted[it.k])continue;
    if(!it.op){if(!HB[it.h])continue;S.gifted[it.k]=1;give(it.h);lastH=it.h;n++;continue}
    S.gifted[it.k]=1;mod=1;const v=Math.floor(+it.v||0),o=it.h&&S.chars[it.h];
    if(it.op==='pts'){S.pts=Math.max(0,S.pts+v);if(v>0)S.total+=v}
    else if(it.op==='arena')S.arena=Math.max(1,Math.min(999,v||1));
    else if(it.op==='rid'){S.solved={};S.failed={};S.hint={};S.streak=0;S.daily=''}
    else if(it.op==='hlvl'&&o){o.lvl=Math.max(1,Math.min(20,o.lvl+v));o.xp=0}
    else if(it.op==='rmchar'&&o){if(Object.keys(S.chars).length>1){delete S.chars[it.h];if(S.sel===it.h)S.sel=Object.keys(S.chars)[0];if(S.craft&&S.craft.out===it.h&&S.craft.evo)S.craft=null}else{o.n=1;o.lvl=1;o.st=1;o.xp=0}}
  }
  if(n||mod){save();if(view!=='fight'&&view!=='duel')render()}
  if(n)reward(lastH,S.chars[lastH].st,n>1?n+' cadeaux de l\'admin reçus !':'Cadeau de l\'admin !');else if(mod)toast('L\'admin a modifié ton compte');
}
function duelClock(){
  if(!DU||DU.s!=='play')return;resolveDuel();if(!DU||DU.s!=='play')return;
  const left=30-Math.floor((Date.now()-DU.rt)/1000),moved=DU.mv.length>DU.n,el=$('#dtm');
  if(!moved){if(left<=0)A.dmv({m:'F'});else if(el)el.textContent='Choisis ton action · '+left+' s'}
  else if(left<-20&&DU.om.length<=DU.n&&!DU.claim){DU.claim=1;if(view==='duel')render()}
}
function duelPanel(){
  const others=PEERS.filter(p=>!p.sameTab&&p.presence?.nick),bets=[0,10,25,50,100,250,500].filter(b=>b<=S.pts);if(!bets.includes(betSel))betSel=0;
  return `<div class="panel" style="border-color:var(--arc)"><h2>Joueurs en ligne</h2>
   ${!room?'<p class="mute">Connexion au serveur impossible pour le moment. Recharge la page.</p>'
   :`<p class="mute small">Défie un joueur connecté ou propose-lui un échange de héros. En duel, chacun mise des points et le gagnant prend tout. Le combat se joue au tour par tour : vous choisissez chacun une action en secret, 30 secondes par manche.</p>
   <label style="max-width:220px">Ta mise<select id="bet">${bets.map(b=>`<option value="${b}" ${b===betSel?'selected':''}>${b?b+' points':'Sans mise'}</option>`).join('')}</select></label>
   ${others.length?others.map(p=>{const h=fz(p.presence?.h),busy=!!p.presence?.d;return `<div class="row"><span class="grow"><b>${esc(pname(p))}</b> <span class="mute small">· ${h.c.n} niv. ${h.l} · ${+p.presence?.pts>=INF?'∞':Math.max(0,Math.floor(+p.presence?.pts||0))} pts</span></span><button class="btn2" data-a="dinv" data-p="${esc(p.peer)}" ${busy||DU?'disabled':''}>${busy?'En duel':'Défier'}</button><button data-a="topen" data-p="${esc(p.peer)}" ${p.presence?.c?'':'disabled'}>Échanger</button></div>`}).join('')
   :'<p class="mute">Personne d\'autre n\'est en ligne pour le moment. Envoie le lien du jeu à tes potes : ils apparaîtront ici dès qu\'ils ouvrent le jeu.</p>'}`}</div>`;
}
function giftList(){const m=new Map(PLAYERS.map(p=>[p.id,{id:p.id,nick:p.nick}]));for(const p of PEERS)if(p.by){const e=m.get(p.by)||{id:p.by};e.nick=pname(p);e.on=1;m.set(p.by,e)}return [...m.values()]}

/* ================== BOUCLE, HORLOGE, DONNÉES PARTAGÉES ================== */
let last=0;
function loop(ts){const t=ts/1000,dt=Math.min(.033,t-last||.016);last=t;try{if(F&&view==='fight')fightTick(dt,t);drawPortraits(t)}catch(e){console.error(e)}requestAnimationFrame(loop)}
let wasEv=false;
setInterval(()=>{hud();duelClock();seenSync();const e=!!ev();if(e!==wasEv){wasEv=e;if(view==='home'||view==='forge')render()}
  if(view==='forge'){const c=S.craft,b=$('#cbtn');if(c&&b){const left=c.end-Date.now();if(left<=0){if(b.disabled)render()}else{b.textContent=fmt(left);$('#cbar').style.width=(1-left/c.dur)*100+'%'}}const r=$('#rot');if(r){const n=nextRot();r.textContent='changent dans '+fmt(n);if(n>(CFG.rot||60)*60000-1500&&!S.craft)render()}}
},1000);
async function syncPlayer(){
  if(!db||!uid||syncDead||syncing||!ready||gated())return;
  const d={nick:S.nick||'Joueur',pts:S.pts,total:S.total,arena:S.arena,heroes:Object.keys(S.chars).length,solved:Object.keys(S.solved).length},sig=JSON.stringify(d);
  if(sig===lastSig||Date.now()-lastSync<45000)return;
  syncing=true;lastSync=Date.now();try{await db.doc('players/'+uid).set({...d,at:Date.now()});lastSig=sig}catch(e){if(e&&e.code!=='unavailable')syncDead=true}syncing=false;
}
async function codeId(code){const en=new TextEncoder(),k=await crypto.subtle.importKey('raw',en.encode(code),'PBKDF2',false,['deriveBits']),b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:en.encode('legendes-pieges-v1'),iterations:60000,hash:'SHA-256'},k,128);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function watchCode(){if(!db||!S.code)return;try{const id=await codeId(S.code);myCid=id;pushPres();if(codeUnsub)codeUnsub();
  codeUnsub=db.doc('codes/'+id).onSnapshot(s=>{if(s.metadata&&s.metadata.fromCache)return;
    if(!s.exists){S.code='';S.joined=0;save();try{room&&room.presence({nick:null,h:null,d:null,tr:null,c:null})}catch(e){};view='home';sub={};render();drawInv();toast('Ton code a été désactivé.')}
    else{const n=cleanN(s.data().name);if(n&&n!==S.nick){S.nick=n;save()}}},()=>{})}catch(e){}}
async function boot(){
  $('#hlogo').innerHTML=LOGO;applyLang();render();requestAnimationFrame(loop);
  try{PR=await fbPrims();uid=PR.uid;db=mkDb(PR);room=mkRoom(PR);
    if(S.code){try{const k=await admKey(S.code);isAdmin=!!k&&(await PR.get('admins/'+uid))===k}catch(e){}}
    if(S.code&&!isAdmin){const m=await PR.get('members/'+uid).catch(()=>null);S.joined=m?1:0;if(!m){S.code=''}}
  }catch(e){console.error('serveur',e);PR=null;db=null;room=null}
  if(room){try{room.onPeers(roomTick,()=>{})}catch(e){}}
  ready=true;if(isAdmin){S.nick=S.nick||'Shai';S.joined=1}if(boss()){unlockAll();S.pts=INF}render();pushPres();
  if(db&&isAdmin){let seeded=false;db.doc('adm/codes').onSnapshot(s=>{CODES=s.exists?(s.data().list||[]).slice():[];if(!seeded){seeded=true;if(!s.exists)seedCodes(S.code)}if(view==='admin'&&!typing())render()},()=>{})}
  if(db&&S.code&&!isAdmin)watchCode();
  if(room){try{room.onPeers(roomTick,()=>{})}catch(e){}pushPres();if(view==='fprep')render()}
  if(db){
    db.doc('game/config').onSnapshot(s=>{CFG=Object.assign({rot:60,recipes:[],riddles:[],event:null},s.exists?JSON.parse(JSON.stringify(s.data())):{});wasEv=!!ev();hud();if(view==='home'||view==='forge'||view==='rid')render()},()=>{});
    db.collection('players').onSnapshot(s=>{PLAYERS=s.docs.map(d=>({id:d.id,...d.data()}));if(view==='home'&&document.activeElement?.id!=='nick')render()},()=>{});
    syncPlayer();
    if(uid)db.doc('gifts/'+uid).onSnapshot(s=>{if(s.exists)applyCmds(s.data().items)},()=>{});
    if(isAdmin)db.collection('adm/seen/p').onSnapshot(s=>{SEEN={};s.docs.forEach(d=>SEEN[d.id]=d.data());if(view==='admin'&&!typing())render()},()=>{});
  }
  if(isAdmin){H.forEach(c=>{if(!S.chars[c.id])S.chars[c.id]={n:1,lvl:1,xp:0,st:1}});save();if(view!=='fight'&&view!=='duel')render()}
}
boot();
</script>
